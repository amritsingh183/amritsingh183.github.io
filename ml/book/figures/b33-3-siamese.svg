<rect x="498" y="206" width="44" height="22" rx="2" fill="#86b6ef" stroke="#e1e0d9" stroke-width="1"/>
<text x="520" y="221" text-anchor="middle">0.05</text>
<rect x="498" y="228" width="44" height="22" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="520" y="243" text-anchor="middle">0.00</text>
<rect x="498" y="250" width="44" height="22" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
