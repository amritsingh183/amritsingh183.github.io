<line x1="430" y1="283" x2="492" y2="283" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="544" y1="184" x2="584" y2="184" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="586" y="150" width="122" height="68" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="647" y="181" text-anchor="middle">classifier</text>
<text x="647" y="196" fill="#52514e" text-anchor="middle">3 scores, softmax</text>
<text x="647" y="246" fill="#52514e" text-anchor="middle">entailment</text>
<text x="647" y="262" fill="#52514e" text-anchor="middle">neutral</text>
<text x="647" y="278" fill="#52514e" text-anchor="middle">contradiction</text>
<text x="360" y="356" fill="#898781" text-anchor="middle">the encoder here is the made-up table of Figure 25.1; SBERT uses BERT.</text>
<text x="360" y="372" fill="#898781" text-anchor="middle">After training, only u and v are kept and compared by cosine; the classifier is thrown away.</text>
</g>
</svg>
