<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 388" width="720" height="388" role="img" aria-labelledby="title desc">
<title id="title">SBERT&apos;s training path: two blurbs pass through one shared encoder, their mean-pooled vectors u and v are joined with |u − v|, and a small classifier names the relation</title>
<desc id="desc">Blurbs B1 and B4 each go through the same encoder and mean pooling, giving four-number vectors u and v computed from the made-up feature table; the element-wise difference is computed; the twelve joined numbers feed a classifier with three outputs: entailment, neutral, contradiction.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="720" height="388" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<text x="16" y="56">B1: a quiet mystery in a small town</text>
<rect x="16" y="68" width="196" height="34" rx="2" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="114" y="90" text-anchor="middle">encoder + mean pooling</text>
<line x1="214" y1="85" x2="250" y2="85" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="254" y="72" width="44" height="26" rx="2" fill="#86b6ef" stroke="#e1e0d9" stroke-width="1"/>
<text x="276" y="89" text-anchor="middle">0.20</text>
<rect x="298" y="72" width="44" height="26" rx="2" fill="#86b6ef" stroke="#e1e0d9" stroke-width="1"/>
<text x="320" y="89" text-anchor="middle">0.24</text>
<rect x="342" y="72" width="44" height="26" rx="2" fill="#86b6ef" stroke="#e1e0d9" stroke-width="1"/>
<text x="364" y="89" text-anchor="middle">0.03</text>
<rect x="386" y="72" width="44" height="26" rx="2" fill="#86b6ef" stroke="#e1e0d9" stroke-width="1"/>
<text x="408" y="89" text-anchor="middle">0.01</text>
<text x="342" y="62" text-anchor="middle">u</text>
<text x="16" y="166">B4: the detective returns to the village</text>
<rect x="16" y="178" width="196" height="34" rx="2" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="114" y="200" text-anchor="middle">encoder + mean pooling</text>
<line x1="214" y1="195" x2="250" y2="195" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="254" y="182" width="44" height="26" rx="2" fill="#86b6ef" stroke="#e1e0d9" stroke-width="1"/>
<text x="276" y="199" text-anchor="middle">0.20</text>
<rect x="298" y="182" width="44" height="26" rx="2" fill="#86b6ef" stroke="#e1e0d9" stroke-width="1"/>
<text x="320" y="199" text-anchor="middle">0.18</text>
<rect x="342" y="182" width="44" height="26" rx="2" fill="#86b6ef" stroke="#e1e0d9" stroke-width="1"/>
<text x="364" y="199" text-anchor="middle">0.05</text>
<rect x="386" y="182" width="44" height="26" rx="2" fill="#86b6ef" stroke="#e1e0d9" stroke-width="1"/>
<text x="408" y="199" text-anchor="middle">0.05</text>
<text x="342" y="172" text-anchor="middle">v</text>
<text x="114" y="124" fill="#2a78d6" text-anchor="middle">one encoder, used twice:</text>
<text x="114" y="138" fill="#2a78d6" text-anchor="middle">the same weights</text>
<text x="342" y="262" text-anchor="middle">|u − v|</text>
<rect x="254" y="270" width="44" height="26" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="276" y="287" text-anchor="middle">0.00</text>
<rect x="298" y="270" width="44" height="26" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="320" y="287" text-anchor="middle">0.06</text>
<rect x="342" y="270" width="44" height="26" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="364" y="287" text-anchor="middle">0.02</text>
<rect x="386" y="270" width="44" height="26" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="408" y="287" text-anchor="middle">0.04</text>
<text x="254" y="316" fill="#52514e">their gap, number by number</text>
<text x="520" y="40" text-anchor="middle" font-weight="600">(u, v, |u − v|)</text>
