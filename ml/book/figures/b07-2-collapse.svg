<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="title desc">
<title id="title">Two straight layers are one straight layer</title>
<desc id="desc">Left: two layers with no bend between them. Right: the single layer they add up to, with weights 5 and 1 and bias −1.5. For the input (1, 2) both give 5.5; with a ReLU between the layers the answer becomes 6.5.</desc>
<rect width="720" height="330" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<line x1="68" y1="80" x2="152" y2="80" stroke="#c3c2b7" stroke-width="1.2"/>
<line x1="68" y1="80" x2="152" y2="170" stroke="#c3c2b7" stroke-width="1.2"/>
<circle cx="50" cy="80" r="18" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="50" y="84" text-anchor="middle">x₁</text>
<line x1="68" y1="170" x2="152" y2="80" stroke="#c3c2b7" stroke-width="1.2"/>
<line x1="68" y1="170" x2="152" y2="170" stroke="#c3c2b7" stroke-width="1.2"/>
<circle cx="50" cy="170" r="18" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="50" y="174" text-anchor="middle">x₂</text>
<line x1="188" y1="80" x2="272" y2="125" stroke="#c3c2b7" stroke-width="1.2"/>
<circle cx="170" cy="80" r="18" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="170" y="84" text-anchor="middle">h₁</text>
<line x1="188" y1="170" x2="272" y2="125" stroke="#c3c2b7" stroke-width="1.2"/>
<circle cx="170" cy="170" r="18" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="170" y="174" text-anchor="middle">h₂</text>
<circle cx="290" cy="125" r="18" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="290" y="129" text-anchor="middle">out</text>
<text x="170" y="26" font-size="13" text-anchor="middle" font-weight="600">two layers, no bend</text>
<text x="20" y="214">layer 1: h₁ = x₁ − x₂</text>
<text x="20" y="231">layer 1: h₂ = 2x₁ + x₂ − 1</text>
<text x="20" y="248">layer 2: out = h₁ + 2h₂ + 0.5</text>
<text x="360" y="130" font-size="20" text-anchor="middle" font-weight="600">=</text>
<line x1="448" y1="80" x2="582" y2="125" stroke="#c3c2b7" stroke-width="1.2"/>
<circle cx="430" cy="80" r="18" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="430" y="84" text-anchor="middle">x₁</text>
<line x1="448" y1="170" x2="582" y2="125" stroke="#c3c2b7" stroke-width="1.2"/>
<circle cx="430" cy="170" r="18" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="430" y="174" text-anchor="middle">x₂</text>
<circle cx="600" cy="125" r="18" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="600" y="129" text-anchor="middle">out</text>
<text x="505" y="90" fill="#1baf7a" text-anchor="middle">5</text>
<text x="505" y="170" fill="#eb6834" text-anchor="middle">1</text>
<text x="520" y="26" font-size="13" text-anchor="middle" font-weight="600">one layer</text>
<text x="400" y="214">out = 5x₁ + x₂ − 1.5</text>
<text x="400" y="231" fill="#52514e">weights: layer 2&apos;s weights times layer 1&apos;s;</text>
<text x="400" y="247" fill="#52514e">bias: layer 2 applied to layer 1&apos;s bias,</text>
<text x="400" y="263" fill="#52514e">plus its own</text>
<line x1="20" y1="274" x2="700" y2="274" stroke="#e1e0d9" stroke-width="1"/>
<text x="20" y="294">check with x = (1, 2): two layers give h = (−1, 3), out = 5.5; one layer gives 5.5</text>
<text x="20" y="313" fill="#eb6834">with a ReLU between: h = (0, 3), out = 6.5, and the single straight layer no longer matches</text>
</g>
</svg>
