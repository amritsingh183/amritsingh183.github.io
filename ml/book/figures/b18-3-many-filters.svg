<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="title desc">
<title id="title">Four filters give four output channels; each filter spans every input channel</title>
<desc id="desc">Left, a 4 by 4 by 3 input block; middle, four filters drawn as small three-plane stacks in four colours; right, the four 2 by 2 output maps stacked into a 2 by 2 by 4 block; the parameter count is written beneath.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="720" height="330" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<text x="30" y="34" font-weight="600">input: 4 × 4 × 3</text>
<rect x="68" y="82" width="96" height="96" rx="2" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1"/>
<rect x="54" y="96" width="96" height="96" rx="2" fill="#fcfcfb" stroke="#1baf7a" stroke-width="1"/>
<rect x="40" y="110" width="96" height="96" rx="2" fill="#fcfcfb" stroke="#eb6834" stroke-width="1"/>
<text x="40" y="234" fill="#52514e">red, green, blue planes</text>
<text x="270" y="34" font-weight="600">4 filters, each 3 × 3 × 3</text>
<rect x="288" y="58" width="30" height="30" rx="2" fill="#f0efec" stroke="#2a78d6" stroke-width="1"/>
<rect x="282" y="64" width="30" height="30" rx="2" fill="#f0efec" stroke="#2a78d6" stroke-width="1"/>
<rect x="276" y="70" width="30" height="30" rx="2" fill="#f0efec" stroke="#2a78d6" stroke-width="1"/>
<text x="334" y="92" fill="#52514e">filter 1: 27 weights + 1 bias</text>
<line x1="522" y1="86" x2="574" y2="130" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="288" y="114" width="30" height="30" rx="2" fill="#f0efec" stroke="#eb6834" stroke-width="1"/>
<rect x="282" y="120" width="30" height="30" rx="2" fill="#f0efec" stroke="#eb6834" stroke-width="1"/>
<rect x="276" y="126" width="30" height="30" rx="2" fill="#f0efec" stroke="#eb6834" stroke-width="1"/>
<text x="334" y="148" fill="#52514e">filter 2: 27 weights + 1 bias</text>
<line x1="522" y1="142" x2="574" y2="136" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="288" y="170" width="30" height="30" rx="2" fill="#f0efec" stroke="#1baf7a" stroke-width="1"/>
<rect x="282" y="176" width="30" height="30" rx="2" fill="#f0efec" stroke="#1baf7a" stroke-width="1"/>
<rect x="276" y="182" width="30" height="30" rx="2" fill="#f0efec" stroke="#1baf7a" stroke-width="1"/>
<text x="334" y="204" fill="#52514e">filter 3: 27 weights + 1 bias</text>
<line x1="522" y1="198" x2="574" y2="142" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="288" y="226" width="30" height="30" rx="2" fill="#f0efec" stroke="#52514e" stroke-width="1"/>
<rect x="282" y="232" width="30" height="30" rx="2" fill="#f0efec" stroke="#52514e" stroke-width="1"/>
<rect x="276" y="238" width="30" height="30" rx="2" fill="#f0efec" stroke="#52514e" stroke-width="1"/>
<text x="334" y="260" fill="#52514e">filter 4: 27 weights + 1 bias</text>
<line x1="522" y1="254" x2="574" y2="148" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="160" y1="150" x2="280" y2="150" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="580" y="34" font-weight="600">output: 2 × 2 × 4</text>
<rect x="622" y="68" width="70" height="70" rx="2" fill="#cde2fb" stroke="#52514e" stroke-width="1"/>
<line x1="657" y1="68" x2="657" y2="138" stroke="#52514e" stroke-width="1"/>
<line x1="622" y1="103" x2="692" y2="103" stroke="#52514e" stroke-width="1"/>
<rect x="608" y="82" width="70" height="70" rx="2" fill="#cde2fb" stroke="#1baf7a" stroke-width="1"/>
<line x1="643" y1="82" x2="643" y2="152" stroke="#1baf7a" stroke-width="1"/>
<line x1="608" y1="117" x2="678" y2="117" stroke="#1baf7a" stroke-width="1"/>
<rect x="594" y="96" width="70" height="70" rx="2" fill="#cde2fb" stroke="#eb6834" stroke-width="1"/>
<line x1="629" y1="96" x2="629" y2="166" stroke="#eb6834" stroke-width="1"/>
<line x1="594" y1="131" x2="664" y2="131" stroke="#eb6834" stroke-width="1"/>
<rect x="580" y="110" width="70" height="70" rx="2" fill="#cde2fb" stroke="#2a78d6" stroke-width="1"/>
<line x1="615" y1="110" x2="615" y2="180" stroke="#2a78d6" stroke-width="1"/>
<line x1="580" y1="145" x2="650" y2="145" stroke="#2a78d6" stroke-width="1"/>
<text x="580" y="234" fill="#52514e">one map per filter</text>
<text x="30" y="280" font-weight="600">parameters: 4 × (3 × 3 × 3 + 1) = 112</text>
<text x="30" y="300" fill="#52514e">In CS231n&apos;s example, 96 filters of 11 × 11 × 3 give 96 × (11 × 11 × 3 + 1) = 34,944 parameters.</text>
<text x="30" y="316" fill="#52514e">The number of output channels is always the number of filters.</text>
</g>
</svg>
