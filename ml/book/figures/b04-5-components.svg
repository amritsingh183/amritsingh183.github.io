<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" aria-labelledby="title desc">
<title id="title">Where the three components of the cross product come from</title>
<desc id="desc">The determinant with x, y, z in the first column and v, w in the others. Expanding down the first column, each of x, y, z is multiplied by a 2 × 2 determinant of the other two rows; those three numbers, −3, −2 and 6, are p = v × w.</desc>
<rect width="720" height="290" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<text x="20" y="30" font-size="13" font-weight="600">det of the columns (x, y, z), v, w</text>
<rect x="40" y="50" width="40" height="32" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="60" y="70" fill="#2a78d6" text-anchor="middle">x</text>
<rect x="80" y="50" width="40" height="32" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="100" y="70" fill="#1baf7a" text-anchor="middle">2</text>
<rect x="120" y="50" width="40" height="32" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="140" y="70" fill="#eb6834" text-anchor="middle">0</text>
<rect x="40" y="82" width="40" height="32" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="60" y="102" fill="#2a78d6" text-anchor="middle">y</text>
<rect x="80" y="82" width="40" height="32" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="100" y="102" fill="#1baf7a" text-anchor="middle">0</text>
<rect x="120" y="82" width="40" height="32" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="140" y="102" fill="#eb6834" text-anchor="middle">3</text>
<rect x="40" y="114" width="40" height="32" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="60" y="134" fill="#2a78d6" text-anchor="middle">z</text>
<rect x="80" y="114" width="40" height="32" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="100" y="134" fill="#1baf7a" text-anchor="middle">1</text>
<rect x="120" y="114" width="40" height="32" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="140" y="134" fill="#eb6834" text-anchor="middle">1</text>
<text x="60" y="164" fill="#2a78d6" text-anchor="middle">x, y, z</text>
<text x="100" y="164" fill="#1baf7a" text-anchor="middle">v</text>
<text x="140" y="164" fill="#eb6834" text-anchor="middle">w</text>
<text x="20" y="200" fill="#52514e">for each letter, use the two</text>
<text x="20" y="216" fill="#52514e">rows below it, wrapping round</text>
<text x="20" y="232" fill="#52514e">to the top when needed</text>
<text x="270" y="70" font-size="13" fill="#2a78d6" text-anchor="middle" font-weight="600">x</text>
<text x="284" y="70">×</text>
<rect x="300" y="44" width="34" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="317" y="61" fill="#1baf7a" text-anchor="middle">0</text>
<rect x="334" y="44" width="34" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="351" y="61" fill="#eb6834" text-anchor="middle">3</text>
<rect x="300" y="70" width="34" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="317" y="87" fill="#1baf7a" text-anchor="middle">1</text>
<rect x="334" y="70" width="34" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="351" y="87" fill="#eb6834" text-anchor="middle">1</text>
<text x="384" y="62">p₁ = v₂w₃ − v₃w₂ = 0×1 − 1×3 = −3</text>
<text x="384" y="80" fill="#52514e">the number that multiplies x</text>
<text x="270" y="142" font-size="13" fill="#2a78d6" text-anchor="middle" font-weight="600">y</text>
<text x="284" y="142">×</text>
<rect x="300" y="116" width="34" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="317" y="133" fill="#1baf7a" text-anchor="middle">1</text>
<rect x="334" y="116" width="34" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="351" y="133" fill="#eb6834" text-anchor="middle">1</text>
<rect x="300" y="142" width="34" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="317" y="159" fill="#1baf7a" text-anchor="middle">2</text>
<rect x="334" y="142" width="34" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="351" y="159" fill="#eb6834" text-anchor="middle">0</text>
<text x="384" y="134">p₂ = v₃w₁ − v₁w₃ = 1×0 − 2×1 = −2</text>
<text x="384" y="152" fill="#52514e">the number that multiplies y</text>
<text x="270" y="214" font-size="13" fill="#2a78d6" text-anchor="middle" font-weight="600">z</text>
<text x="284" y="214">×</text>
<rect x="300" y="188" width="34" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="317" y="205" fill="#1baf7a" text-anchor="middle">2</text>
<rect x="334" y="188" width="34" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="351" y="205" fill="#eb6834" text-anchor="middle">0</text>
<rect x="300" y="214" width="34" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="317" y="231" fill="#1baf7a" text-anchor="middle">0</text>
<rect x="334" y="214" width="34" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="351" y="231" fill="#eb6834" text-anchor="middle">3</text>
<text x="384" y="206">p₃ = v₁w₂ − v₂w₁ = 2×3 − 0×0 = 6</text>
<text x="384" y="224" fill="#52514e">the number that multiplies z</text>
<text x="270" y="274" font-size="13" font-weight="600">so p = (−3, −2, 6) and det = p · (x, y, z)</text>
</g>
</svg>
