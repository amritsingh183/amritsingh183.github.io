<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 272" width="720" height="272" role="img" aria-labelledby="title desc">
<title id="title">Most vectors are knocked off their line; eigenvectors are not</title>
<desc id="desc">Left: the plane before the matrix with columns (3, 0) and (1, 2), with two dashed lines of eigenvectors and an ordinary vector (1, 1). Right: after it, (1, 0) has become (3, 0), 3 times as long, (−1, 1) has become (−2, 2), 2 times as long, and (1, 1) has become (4, 2), off its own line.</desc>
