<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" role="img" aria-labelledby="title desc">
<title id="title">Nudge an input and watch J</title>
<desc id="desc">A table: nudging a, b or c by 0.001 moves J from 33 to 33.003, 33.006 or 33.009; the change divided by the nudge is 3, 6 and 9, the gradients the backward pass found.</desc>
<rect width="720" height="230" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<rect x="16" y="30" width="110" height="30" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="71" y="49" text-anchor="middle">nudge</text>
<rect x="126" y="30" width="90" height="30" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="171" y="49" text-anchor="middle">u = b × c</text>
<rect x="216" y="30" width="90" height="30" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="261" y="49" text-anchor="middle">v = a + u</text>
<rect x="306" y="30" width="90" height="30" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="351" y="49" text-anchor="middle">J = 3 × v</text>
<rect x="396" y="30" width="100" height="30" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="446" y="49" text-anchor="middle">change in J</text>
<rect x="496" y="30" width="110" height="30" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="551" y="49" text-anchor="middle">change ÷ 0.001</text>
<rect x="606" y="30" width="100" height="30" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="656" y="49" text-anchor="middle">backward pass</text>
<rect x="16" y="60" width="110" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="71" y="79" text-anchor="middle">a: 5 → 5.001</text>
<rect x="126" y="60" width="90" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="171" y="79" text-anchor="middle">6.000</text>
<rect x="216" y="60" width="90" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="261" y="79" text-anchor="middle">11.001</text>
<rect x="306" y="60" width="90" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="351" y="79" text-anchor="middle">33.003</text>
<rect x="396" y="60" width="100" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="446" y="79" text-anchor="middle">0.003</text>
<rect x="496" y="60" width="110" height="30" rx="2" fill="#cde2fb" stroke="#e1e0d9" stroke-width="1"/>
<text x="551" y="79" text-anchor="middle">3.00</text>
<rect x="606" y="60" width="100" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="656" y="79" fill="#eb6834" text-anchor="middle">3</text>
<rect x="16" y="90" width="110" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="71" y="109" text-anchor="middle">b: 3 → 3.001</text>
<rect x="126" y="90" width="90" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="171" y="109" text-anchor="middle">6.002</text>
<rect x="216" y="90" width="90" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="261" y="109" text-anchor="middle">11.002</text>
<rect x="306" y="90" width="90" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="351" y="109" text-anchor="middle">33.006</text>
<rect x="396" y="90" width="100" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="446" y="109" text-anchor="middle">0.006</text>
<rect x="496" y="90" width="110" height="30" rx="2" fill="#cde2fb" stroke="#e1e0d9" stroke-width="1"/>
<text x="551" y="109" text-anchor="middle">6.00</text>
<rect x="606" y="90" width="100" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="656" y="109" fill="#eb6834" text-anchor="middle">6</text>
<rect x="16" y="120" width="110" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="71" y="139" text-anchor="middle">c: 2 → 2.001</text>
<rect x="126" y="120" width="90" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="171" y="139" text-anchor="middle">6.003</text>
<rect x="216" y="120" width="90" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="261" y="139" text-anchor="middle">11.003</text>
<rect x="306" y="120" width="90" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="351" y="139" text-anchor="middle">33.009</text>
<rect x="396" y="120" width="100" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="446" y="139" text-anchor="middle">0.009</text>
<rect x="496" y="120" width="110" height="30" rx="2" fill="#cde2fb" stroke="#e1e0d9" stroke-width="1"/>
<text x="551" y="139" text-anchor="middle">9.00</text>
<rect x="606" y="120" width="100" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="656" y="139" fill="#eb6834" text-anchor="middle">9</text>
<text x="16" y="180">before any nudge: u = 6, v = 11, J = 33</text>
<text x="16" y="200" fill="#52514e">the nudge measures one gradient at a time; the backward pass gets all three in one sweep</text>
</g>
</svg>
