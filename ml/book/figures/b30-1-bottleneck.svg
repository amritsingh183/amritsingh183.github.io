<text x="424" y="108" text-anchor="middle">town</text>
<text x="30" y="40">encoder: reads the English, one word per step</text>
<line x1="448" y1="71" x2="512" y2="71" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="514" y="50" width="116" height="44" rx="2" fill="#86b6ef" stroke="#eb6834" stroke-width="1.5"/>
<text x="572" y="69" text-anchor="middle">context vector</text>
<text x="572" y="85" fill="#52514e" text-anchor="middle">one fixed size</text>
