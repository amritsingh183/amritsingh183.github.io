<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="title desc">
<title id="title">An encoder reads the English blurb one word at a time and hands the decoder a single context vector; everything the decoder knows must pass through it</title>
<desc id="desc">Top row: seven encoder cells linked left to right, each fed one English word of blurb B1. The last cell feeds one outlined context vector box. Bottom row: seven decoder cells linked left to right, starting from the context vector and producing the French words.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="720" height="300" fill="#fcfcfb"/>
