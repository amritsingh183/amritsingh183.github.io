<rect x="216" y="56" width="44" height="30" rx="2" fill="#cde2fb" stroke="#2a78d6" stroke-width="1"/>
<text x="238" y="108" text-anchor="middle">in</text>
<line x1="262" y1="71" x2="276" y2="71" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="278" y="56" width="44" height="30" rx="2" fill="#cde2fb" stroke="#2a78d6" stroke-width="1"/>
<text x="300" y="108" text-anchor="middle">a</text>
<line x1="324" y1="71" x2="338" y2="71" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="340" y="56" width="44" height="30" rx="2" fill="#cde2fb" stroke="#2a78d6" stroke-width="1"/>
