<text x="52" y="108" text-anchor="middle">a</text>
<line x1="76" y1="71" x2="90" y2="71" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="92" y="56" width="44" height="30" rx="2" fill="#cde2fb" stroke="#2a78d6" stroke-width="1"/>
