<text x="424" y="238" text-anchor="middle">ville</text>
<text x="480" y="206">decoder: writes the French,</text>
<text x="480" y="222">starting from the context</text>
<text x="360" y="280" fill="#52514e" text-anchor="middle">a long blurb and a short one must fit through the same fixed-size vector</text>
</g>
