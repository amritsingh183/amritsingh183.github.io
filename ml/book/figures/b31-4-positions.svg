<text x="678" y="184" fill="#898781" text-anchor="middle">6</text>
<text x="28" y="232" fill="#52514e">position number under each chart; the word a sits at positions 0 and 4 of the blurb</text>
<rect x="250" y="256" width="70" height="28" rx="2" fill="#cde2fb" stroke="#e1e0d9" stroke-width="1"/>
<text x="285" y="274" text-anchor="middle">0.000</text>
<rect x="320" y="256" width="70" height="28" rx="2" fill="#cde2fb" stroke="#e1e0d9" stroke-width="1"/>
<text x="355" y="274" text-anchor="middle">1.000</text>
<rect x="390" y="256" width="70" height="28" rx="2" fill="#cde2fb" stroke="#e1e0d9" stroke-width="1"/>
<text x="425" y="274" text-anchor="middle">0.000</text>
<rect x="460" y="256" width="70" height="28" rx="2" fill="#cde2fb" stroke="#e1e0d9" stroke-width="1"/>
<text x="495" y="274" text-anchor="middle">1.000</text>
<rect x="250" y="284" width="70" height="28" rx="2" fill="#cde2fb" stroke="#e1e0d9" stroke-width="1"/>
<text x="285" y="302" text-anchor="middle">−0.757</text>
<rect x="320" y="284" width="70" height="28" rx="2" fill="#cde2fb" stroke="#e1e0d9" stroke-width="1"/>
<text x="355" y="302" text-anchor="middle">−0.654</text>
<rect x="390" y="284" width="70" height="28" rx="2" fill="#cde2fb" stroke="#e1e0d9" stroke-width="1"/>
<text x="425" y="302" text-anchor="middle">0.040</text>
<rect x="460" y="284" width="70" height="28" rx="2" fill="#cde2fb" stroke="#e1e0d9" stroke-width="1"/>
<text x="495" y="302" text-anchor="middle">0.999</text>
<text x="240" y="274" text-anchor="end">a at position 0</text>
<text x="240" y="302" text-anchor="end">a at position 4</text>
<text x="360" y="340" fill="#52514e" text-anchor="middle">added to each word&apos;s embedding, the code makes identical words at different places differ</text>
