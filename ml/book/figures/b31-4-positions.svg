<circle cx="678" cy="58.1" r="3.5" fill="#eb6834" stroke="#fcfcfb" stroke-width="1.5"/>
<text x="548" y="184" fill="#898781" text-anchor="middle">0</text>
<text x="591.3" y="184" fill="#898781" text-anchor="middle">2</text>
