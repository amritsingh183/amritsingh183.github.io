<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="title desc">
<title id="title">Each position gets its own pattern of sines and cosines, so the two copies of a in blurb B1 receive different position codes</title>
<desc id="desc">Four small line charts, one per number of a four-number position code, plotting its value at positions 0 to 6 under the words of B1; below, the codes of the two copies of a at positions 0 and 4.</desc>
<rect width="720" height="360" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<rect x="28" y="50" width="150" height="120" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<line x1="28" y1="110" x2="178" y2="110" stroke="#e1e0d9" stroke-width="1"/>
<text x="103" y="40" text-anchor="middle">sin(pos)</text>
<path d="M38 110 L59.7 66.2 L81.3 62.7 L103 102.7 L124.7 149.4 L146.3 159.9 L168 124.5" fill="none" stroke="#2a78d6" stroke-width="2"/>
