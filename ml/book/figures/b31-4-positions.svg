<circle cx="316.3" cy="95.2" r="3.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1.5"/>
<circle cx="338" cy="60.1" r="3.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1.5"/>
<text x="208" y="184" fill="#898781" text-anchor="middle">0</text>
<text x="251.3" y="184" fill="#898781" text-anchor="middle">2</text>
<text x="294.7" y="184" fill="#898781" text-anchor="middle">4</text>
<text x="338" y="184" fill="#898781" text-anchor="middle">6</text>
