<rect x="538" y="50" width="150" height="120" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<line x1="538" y1="110" x2="688" y2="110" stroke="#e1e0d9" stroke-width="1"/>
<text x="613" y="40" text-anchor="middle">cos(pos ÷ 100)</text>
