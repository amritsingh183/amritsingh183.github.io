<circle cx="59.7" cy="66.2" r="3.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1.5"/>
<circle cx="81.3" cy="62.7" r="3.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1.5"/>
<circle cx="103" cy="102.7" r="3.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1.5"/>
<circle cx="124.7" cy="149.4" r="3.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1.5"/>
<circle cx="146.3" cy="159.9" r="3.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1.5"/>
<circle cx="168" cy="124.5" r="3.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1.5"/>
<text x="24" y="62" fill="#898781" text-anchor="end">1</text>
<text x="24" y="166" fill="#898781" text-anchor="end">−1</text>
<text x="38" y="184" fill="#898781" text-anchor="middle">0</text>
<text x="38" y="198" text-anchor="middle">a</text>
<text x="59.7" y="184" fill="#898781" text-anchor="middle">1</text>
<text x="81.3" y="184" fill="#898781" text-anchor="middle">2</text>
<text x="103" y="184" fill="#898781" text-anchor="middle">3</text>
<text x="124.7" y="184" fill="#898781" text-anchor="middle">4</text>
<text x="124.7" y="198" text-anchor="middle">a</text>
<text x="146.3" y="184" fill="#898781" text-anchor="middle">5</text>
<text x="168" y="184" fill="#898781" text-anchor="middle">6</text>
<rect x="198" y="50" width="150" height="120" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<line x1="198" y1="110" x2="348" y2="110" stroke="#e1e0d9" stroke-width="1"/>
<text x="273" y="40" text-anchor="middle">cos(pos)</text>
<path d="M208 58 L229.7 81.9 L251.3 131.6 L273 161.5 L294.7 144.0 L316.3 95.2 L338 60.1" fill="none" stroke="#2a78d6" stroke-width="2"/>
<circle cx="208" cy="58" r="3.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1.5"/>
