<title id="title">One filter is three kernels, one per input channel; their three maps are added into one</title>
<desc id="desc">Three rows, one per colour plane: the 4 by 4 plane, its own 3 by 3 kernel, and the resulting 2 by 2 map; arrows join the three maps into their 2 by 2 sum on the right.</desc>
