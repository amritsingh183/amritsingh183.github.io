<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" width="720" height="296" role="img" aria-labelledby="title desc">
<title id="title">Four blocks, each tested once</title>
<desc id="desc">16 priced books, sorted by pages and dealt into 4 blocks. In each of 4 rounds one block (green) is held back for testing and the others (blue) train the model; every book is tested exactly once.</desc>
<rect width="720" height="296" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<text x="180" y="36" text-anchor="middle">block 1</text>
<text x="180" y="52" fill="#52514e" text-anchor="middle">60, 120, 200, 320</text>
<text x="320" y="36" text-anchor="middle">block 2</text>
<text x="320" y="52" fill="#52514e" text-anchor="middle">60, 120, 200, 320</text>
<text x="460" y="36" text-anchor="middle">block 3</text>
<text x="460" y="52" fill="#52514e" text-anchor="middle">90, 160, 260, 400</text>
<text x="600" y="36" text-anchor="middle">block 4</text>
<text x="600" y="52" fill="#52514e" text-anchor="middle">90, 160, 260, 400</text>
<text x="98" y="87" text-anchor="end">round 1</text>
<rect x="113" y="66" width="134" height="34" rx="2" fill="#1baf7a" stroke="#1baf7a" stroke-width="1"/>
<text x="180" y="87" text-anchor="middle" font-weight="600">test</text>
<rect x="253" y="66" width="134" height="34" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="320" y="87" text-anchor="middle">train</text>
<rect x="393" y="66" width="134" height="34" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="460" y="87" text-anchor="middle">train</text>
<rect x="533" y="66" width="134" height="34" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="600" y="87" text-anchor="middle">train</text>
<text x="98" y="133" text-anchor="end">round 2</text>
<rect x="113" y="112" width="134" height="34" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="180" y="133" text-anchor="middle">train</text>
<rect x="253" y="112" width="134" height="34" rx="2" fill="#1baf7a" stroke="#1baf7a" stroke-width="1"/>
<text x="320" y="133" text-anchor="middle" font-weight="600">test</text>
<rect x="393" y="112" width="134" height="34" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="460" y="133" text-anchor="middle">train</text>
<rect x="533" y="112" width="134" height="34" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="600" y="133" text-anchor="middle">train</text>
<text x="98" y="179" text-anchor="end">round 3</text>
<rect x="113" y="158" width="134" height="34" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="180" y="179" text-anchor="middle">train</text>
<rect x="253" y="158" width="134" height="34" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="320" y="179" text-anchor="middle">train</text>
<rect x="393" y="158" width="134" height="34" rx="2" fill="#1baf7a" stroke="#1baf7a" stroke-width="1"/>
<text x="460" y="179" text-anchor="middle" font-weight="600">test</text>
<rect x="533" y="158" width="134" height="34" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="600" y="179" text-anchor="middle">train</text>
<text x="98" y="225" text-anchor="end">round 4</text>
<rect x="113" y="204" width="134" height="34" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="180" y="225" text-anchor="middle">train</text>
<rect x="253" y="204" width="134" height="34" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="320" y="225" text-anchor="middle">train</text>
<rect x="393" y="204" width="134" height="34" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="460" y="225" text-anchor="middle">train</text>
<rect x="533" y="204" width="134" height="34" rx="2" fill="#1baf7a" stroke="#1baf7a" stroke-width="1"/>
<text x="600" y="225" text-anchor="middle" font-weight="600">test</text>
<text x="110" y="264" fill="#52514e">under each block: the page counts of the four books it holds</text>
<text x="110" y="280" fill="#52514e">a method&apos;s score is the average of its four test errors</text>
</g>
</svg>
