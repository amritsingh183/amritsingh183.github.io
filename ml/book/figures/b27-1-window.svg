<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="title desc">
<title id="title">A window slides along the blurb; each position pairs the centre word with its neighbours, which become the training examples</title>
<desc id="desc">Blurb B2 drawn twice as a row of word boxes: first with detective as the centre and two neighbours on each side outlined, then with quiet as the centre near the end, where the window is cut short; the resulting pairs are listed beside each row.</desc>
<rect width="720" height="300" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<rect x="24" y="52" width="22.7" height="26" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="35.4" y="69" text-anchor="middle">a</text>
<rect x="51.7" y="52" width="49.6" height="26" rx="2" fill="#cde2fb" stroke="#c3c2b7" stroke-width="1"/>
<text x="76.5" y="69" text-anchor="middle">small</text>
<rect x="106.3" y="52" width="42.9" height="26" rx="2" fill="#cde2fb" stroke="#c3c2b7" stroke-width="1"/>
<text x="127.8" y="69" text-anchor="middle">town</text>
<rect x="154.2" y="52" width="76.5" height="26" rx="2" fill="#86b6ef" stroke="#c3c2b7" stroke-width="1"/>
<text x="192.4" y="69" text-anchor="middle">detective</text>
<rect x="235.7" y="52" width="36.2" height="26" rx="2" fill="#cde2fb" stroke="#c3c2b7" stroke-width="1"/>
<text x="253.8" y="69" text-anchor="middle">and</text>
<rect x="276.8" y="52" width="22.7" height="26" rx="2" fill="#cde2fb" stroke="#c3c2b7" stroke-width="1"/>
<text x="288.2" y="69" text-anchor="middle">a</text>
<rect x="304.6" y="52" width="49.6" height="26" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="329.4" y="69" text-anchor="middle">quiet</text>
<rect x="359.2" y="52" width="63.0" height="26" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="390.7" y="69" text-anchor="middle">mystery</text>
<rect x="47.7" y="47" width="255.8" height="36" rx="2" fill="none" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="47.7" y="42" fill="#eb6834">window: 2 words each side</text>
<text x="24" y="102">skip-gram examples: (detective, small)  (detective, town)  (detective, and)  (detective, a)</text>
<text x="24" y="120" fill="#52514e">CBOW example: (small, town, and, a) → detective</text>
<rect x="24" y="168" width="22.7" height="26" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="35.4" y="185" text-anchor="middle">a</text>
<rect x="51.7" y="168" width="49.6" height="26" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="76.5" y="185" text-anchor="middle">small</text>
<rect x="106.3" y="168" width="42.9" height="26" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="127.8" y="185" text-anchor="middle">town</text>
<rect x="154.2" y="168" width="76.5" height="26" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="192.4" y="185" text-anchor="middle">detective</text>
<rect x="235.7" y="168" width="36.2" height="26" rx="2" fill="#cde2fb" stroke="#c3c2b7" stroke-width="1"/>
<text x="253.8" y="185" text-anchor="middle">and</text>
<rect x="276.8" y="168" width="22.7" height="26" rx="2" fill="#cde2fb" stroke="#c3c2b7" stroke-width="1"/>
<text x="288.2" y="185" text-anchor="middle">a</text>
<rect x="304.6" y="168" width="49.6" height="26" rx="2" fill="#86b6ef" stroke="#c3c2b7" stroke-width="1"/>
<text x="329.4" y="185" text-anchor="middle">quiet</text>
<rect x="359.2" y="168" width="63.0" height="26" rx="2" fill="#cde2fb" stroke="#c3c2b7" stroke-width="1"/>
<text x="390.7" y="185" text-anchor="middle">mystery</text>
<rect x="231.7" y="163" width="194.5" height="36" rx="2" fill="none" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="231.7" y="158" fill="#eb6834">window: 2 words each side</text>
<text x="24" y="218">skip-gram examples: (quiet, and)  (quiet, a)  (quiet, mystery)</text>
<text x="24" y="236" fill="#52514e">CBOW example: (and, a, mystery) → quiet</text>
<text x="360" y="288" text-anchor="middle">sliding the window over all five blurbs gives 94 (centre, neighbour) pairs</text>
</g>
</svg>
