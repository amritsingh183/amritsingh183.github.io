<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="title desc">
<title id="title">Output sizes for a 6 by 6 input under different kernels, padding and strides</title>
<desc id="desc">A table of eight settings with kernel size, padding, stride, the output-size arithmetic and the resulting output size for an input of 6.</desc>
<rect width="720" height="360" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<text x="30" y="30" font-weight="600">output size o = ⌊(i + 2p − k) / s⌋ + 1, for an input of i = 6</text>
<text x="30" y="64" fill="#52514e" font-weight="600">setting</text>
<text x="330" y="64" fill="#52514e" font-weight="600">k</text>
<text x="372" y="64" fill="#52514e" font-weight="600">p</text>
<text x="414" y="64" fill="#52514e" font-weight="600">s</text>
<text x="460" y="64" fill="#52514e" font-weight="600">arithmetic</text>
<text x="650" y="64" fill="#52514e" font-weight="600">output</text>
<line x1="30" y1="72" x2="700" y2="72" stroke="#c3c2b7" stroke-width="1"/>
<rect x="30" y="78" width="670" height="28" rx="2" fill="#f0efec"/>
<text x="36" y="97">no padding, stride 1 (Figure 17.2)</text>
<text x="334" y="97">3</text>
<text x="376" y="97">0</text>
<text x="418" y="97">1</text>
<text x="460" y="97" fill="#52514e">⌊(6 + 0 − 3) / 1⌋ + 1</text>
<text x="650" y="97" fill="#2a78d6" font-weight="600">4 × 4</text>
<text x="36" y="129">same padding (Figure 17.3)</text>
<text x="334" y="129">3</text>
<text x="376" y="129">1</text>
<text x="418" y="129">1</text>
<text x="460" y="129" fill="#52514e">⌊(6 + 2 − 3) / 1⌋ + 1</text>
<text x="650" y="129" fill="#2a78d6" font-weight="600">6 × 6</text>
<rect x="30" y="142" width="670" height="28" rx="2" fill="#f0efec"/>
<text x="36" y="161">full padding</text>
<text x="334" y="161">3</text>
<text x="376" y="161">2</text>
<text x="418" y="161">1</text>
<text x="460" y="161" fill="#52514e">⌊(6 + 4 − 3) / 1⌋ + 1</text>
<text x="650" y="161" fill="#2a78d6" font-weight="600">8 × 8</text>
<text x="36" y="193">stride 2 (Figure 17.4, left)</text>
<text x="334" y="193">3</text>
<text x="376" y="193">0</text>
<text x="418" y="193">2</text>
<text x="460" y="193" fill="#52514e">⌊(6 + 0 − 3) / 2⌋ + 1</text>
<text x="650" y="193" fill="#2a78d6" font-weight="600">2 × 2</text>
<rect x="30" y="206" width="670" height="28" rx="2" fill="#f0efec"/>
<text x="36" y="225">stride 2 and padding (Figure 17.4, right)</text>
<text x="334" y="225">3</text>
<text x="376" y="225">1</text>
<text x="418" y="225">2</text>
<text x="460" y="225" fill="#52514e">⌊(6 + 2 − 3) / 2⌋ + 1</text>
<text x="650" y="225" fill="#2a78d6" font-weight="600">3 × 3</text>
<text x="36" y="257">a 5 × 5 kernel</text>
<text x="334" y="257">5</text>
<text x="376" y="257">0</text>
<text x="418" y="257">1</text>
<text x="460" y="257" fill="#52514e">⌊(6 + 0 − 5) / 1⌋ + 1</text>
<text x="650" y="257" fill="#2a78d6" font-weight="600">2 × 2</text>
<rect x="30" y="270" width="670" height="28" rx="2" fill="#f0efec"/>
<text x="36" y="289">a 5 × 5 kernel with same padding</text>
<text x="334" y="289">5</text>
<text x="376" y="289">2</text>
<text x="418" y="289">1</text>
<text x="460" y="289" fill="#52514e">⌊(6 + 4 − 5) / 1⌋ + 1</text>
<text x="650" y="289" fill="#2a78d6" font-weight="600">6 × 6</text>
<text x="36" y="321">a 1 × 1 kernel</text>
<text x="334" y="321">1</text>
<text x="376" y="321">0</text>
<text x="418" y="321">1</text>
<text x="460" y="321" fill="#52514e">⌊(6 + 0 − 1) / 1⌋ + 1</text>
<text x="650" y="321" fill="#2a78d6" font-weight="600">6 × 6</text>
<text x="30" y="344" fill="#52514e">The floor ⌊ ⌋ drops a leftover when the last stride would run past the edge.</text>
</g>
</svg>
