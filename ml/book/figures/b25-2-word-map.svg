<line x1="60" y1="194.2" x2="480" y2="194.2" stroke="#e1e0d9" stroke-width="1"/>
<text x="270" y="380" fill="#52514e" text-anchor="middle">first direction (40% of the spread)</text>
<text x="50" y="52" fill="#52514e">second (33%)</text>
