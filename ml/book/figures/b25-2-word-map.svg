<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="title desc">
<title id="title">Flattened to two directions, the made-up feature vectors put crime words, place words, food words and tool words in four separate corners</title>
<desc id="desc">A scatter plot of the eleven content words at their coordinates along the two main directions of the four-feature table, with dashed lines joining three pairs and their cosine similarity written beside each line.</desc>
<rect width="720" height="400" fill="#fcfcfb"/>
