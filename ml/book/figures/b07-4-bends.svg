<text x="230" y="294" fill="#52514e" text-anchor="middle">pages</text>
<text x="20" y="20" fill="#52514e">price (hundreds of rupees)</text>
<text x="430" y="50" font-size="13" font-weight="600">a sum of three ReLUs</text>
<text x="430" y="76">from 0 pages: slope 5.11 per 100 pages</text>
<text x="430" y="93">bend at 100: slope becomes 2.60</text>
<text x="430" y="110">bend at 250: slope becomes 1.13</text>
<text x="430" y="140" fill="#52514e">each bend is one hidden ReLU unit that</text>
<text x="430" y="155" fill="#52514e">switches on at its page count</text>
<text x="430" y="185" fill="#52514e">dashed: the true price curve</text>
<text x="430" y="200" fill="#eb6834">orange: the bent line, equal to the curve</text>
<text x="430" y="215" fill="#eb6834">at 0, 100, 250 and 400 pages</text>
<text x="430" y="245" fill="#52514e">without the bends, any stack of layers</text>
<text x="430" y="260" fill="#52514e">could only draw one straight line</text>
