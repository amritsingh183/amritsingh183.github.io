<rect x="294.1" y="172.5" width="46.3" height="17" rx="2" fill="#fcfcfb"/>
<text x="297.1" y="184.5" fill="#2a78d6">height</text>
<text x="400" y="44" font-size="13" font-weight="600">p = v × w = (−3, −2, 6)</text>
<text x="400" y="70" fill="#52514e">v = (2, 0, 1)  w = (0, 3, 1)</text>
<text x="400" y="87" fill="#2a78d6">x = (0, 0, 2)</text>
<text x="400" y="118">length of p = √49 = 7</text>
<text x="400" y="135" fill="#52514e">= the area of the base, the v–w parallelogram</text>
<text x="400" y="152" fill="#2a78d6">height = shadow of x on p = 12 ÷ 7 ≈ 1.71</text>
<text x="400" y="169">volume = area × height = 7 × 12 ÷ 7 = 12</text>
<text x="400" y="204">check: det[x v w] = 12, and p · x = 12</text>
<text x="400" y="234" fill="#52514e">p is perpendicular to v and w:</text>
<text x="400" y="249" fill="#52514e">p · v = 0, p · w = 0</text>
<text x="400" y="274" fill="#52514e">the thick blue bar on p&apos;s line is x&apos;s shadow:</text>
<text x="400" y="289" fill="#52514e">the box&apos;s height</text>
