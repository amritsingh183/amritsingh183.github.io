<title id="title">The cross product and the volume of a box</title>
<desc id="desc">A box built on v = (2, 0, 1), w = (0, 3, 1) and x = (0, 0, 2). Its base, the parallelogram of v and w, has area 7, the length of p = v × w = (−3, −2, 6). The height is the shadow of x on p&apos;s direction, 12 ÷ 7, and the volume is 12 = det[x v w].</desc>
