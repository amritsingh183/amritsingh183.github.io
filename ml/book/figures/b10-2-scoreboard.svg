<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" role="img" aria-labelledby="title desc">
<title id="title">The cross-validation scoreboard</title>
<desc id="desc">A table of test errors: rows are the 4 rounds and their average, columns are curves of degree 1, 2, 3, 5, 7. The degree 2 curve has the lowest average, 0.63.</desc>
<rect width="720" height="270" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<rect x="30" y="40" width="150" height="28" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="105" y="58" text-anchor="middle">held-out block</text>
<rect x="180" y="40" width="104" height="28" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="232" y="58" text-anchor="middle">degree 1</text>
<rect x="284" y="40" width="104" height="28" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="336" y="58" text-anchor="middle">degree 2</text>
<rect x="388" y="40" width="104" height="28" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="440" y="58" text-anchor="middle">degree 3</text>
<rect x="492" y="40" width="104" height="28" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="544" y="58" text-anchor="middle">degree 5</text>
<rect x="596" y="40" width="104" height="28" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="648" y="58" text-anchor="middle">degree 7</text>
<rect x="30" y="68" width="150" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="105" y="86" text-anchor="middle">round 1 (block 1)</text>
<rect x="180" y="68" width="104" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="232" y="86" text-anchor="middle">0.98</text>
<rect x="284" y="68" width="104" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="336" y="86" text-anchor="middle">0.67</text>
<rect x="388" y="68" width="104" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="440" y="86" text-anchor="middle">0.73</text>
<rect x="492" y="68" width="104" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="544" y="86" text-anchor="middle">0.89</text>
<rect x="596" y="68" width="104" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="648" y="86" text-anchor="middle">1.35</text>
<rect x="30" y="96" width="150" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="105" y="114" text-anchor="middle">round 2 (block 2)</text>
<rect x="180" y="96" width="104" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="232" y="114" text-anchor="middle">0.94</text>
<rect x="284" y="96" width="104" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="336" y="114" text-anchor="middle">0.65</text>
<rect x="388" y="96" width="104" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="440" y="114" text-anchor="middle">0.63</text>
<rect x="492" y="96" width="104" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="544" y="114" text-anchor="middle">0.76</text>
<rect x="596" y="96" width="104" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="648" y="114" text-anchor="middle">1.35</text>
<rect x="30" y="124" width="150" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="105" y="142" text-anchor="middle">round 3 (block 3)</text>
<rect x="180" y="124" width="104" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="232" y="142" text-anchor="middle">0.89</text>
<rect x="284" y="124" width="104" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="336" y="142" text-anchor="middle">0.57</text>
<rect x="388" y="124" width="104" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="440" y="142" text-anchor="middle">0.75</text>
<rect x="492" y="124" width="104" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="544" y="142" text-anchor="middle">0.85</text>
<rect x="596" y="124" width="104" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="648" y="142" text-anchor="middle">1.30</text>
<rect x="30" y="152" width="150" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="105" y="170" text-anchor="middle">round 4 (block 4)</text>
<rect x="180" y="152" width="104" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="232" y="170" text-anchor="middle">0.79</text>
<rect x="284" y="152" width="104" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="336" y="170" text-anchor="middle">0.62</text>
<rect x="388" y="152" width="104" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="440" y="170" text-anchor="middle">0.61</text>
<rect x="492" y="152" width="104" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="544" y="170" text-anchor="middle">0.72</text>
<rect x="596" y="152" width="104" height="28" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="648" y="170" text-anchor="middle">1.30</text>
<rect x="30" y="180" width="150" height="28" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="105" y="198" text-anchor="middle">average</text>
<rect x="180" y="180" width="104" height="28" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="232" y="198" text-anchor="middle">0.90</text>
<rect x="284" y="180" width="104" height="28" rx="2" fill="#86b6ef" stroke="#e1e0d9" stroke-width="1"/>
<text x="336" y="198" text-anchor="middle">0.63</text>
<rect x="388" y="180" width="104" height="28" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="440" y="198" text-anchor="middle">0.68</text>
<rect x="492" y="180" width="104" height="28" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="544" y="198" text-anchor="middle">0.81</text>
<rect x="596" y="180" width="104" height="28" rx="2" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
<text x="648" y="198" text-anchor="middle">1.33</text>
<text x="232" y="32" fill="#52514e" text-anchor="middle">straight line</text>
<text x="336" y="32" fill="#52514e" text-anchor="middle">gentle curve</text>
<text x="648" y="32" fill="#52514e" text-anchor="middle">squiggle</text>
<text x="30" y="234">lowest average: degree 2 (0.63), so cross-validation picks it</text>
<text x="30" y="252" fill="#52514e">each number is a mean squared error on four held-out books</text>
</g>
</svg>
