<title id="title">Quantile normalisation over all reviewers erases a real difference and invents a false one</title>
<desc id="desc">Left, raw scores of two critics and two fans for five books with a fans-minus-critics column reading 3, 3, 3, 3 and 0; right, the same grid after quantile normalisation of all four columns, where the gaps shrink towards zero and book 5 gains a false negative gap, outlined in orange.</desc>
