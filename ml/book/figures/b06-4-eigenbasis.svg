<title id="title">In the eigenbasis the matrix only stretches</title>
<desc id="desc">Left: the grid of the eigenvectors (1, 0) and (−1, 1). The vector ĵ is 1 step of the first and 1 of the second, and M sends it to (1, 2), which is 3 steps of the first and 2 of the second. Right: P⁻¹MP has 3 and 2 on its diagonal and zeros elsewhere, and applying M 10 times multiplies the eigen-coordinates by 3¹⁰ and 2¹⁰.</desc>
