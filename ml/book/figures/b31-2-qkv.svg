<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc">
<title id="title">Queries, keys and values are three learned re-descriptions of each word; here the keys swap the two numbers, and quiet now attends mostly to town instead of itself</title>
<desc id="desc">The three word vectors on the left feed three projections: queries unchanged, keys with their two numbers swapped, values unchanged. Queries meet keys in a table of scaled scores, softmax gives the weights, and the weights mix the values into the outputs.</desc>
