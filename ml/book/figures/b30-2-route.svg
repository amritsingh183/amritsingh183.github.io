<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="title desc">
<title id="title">With attention, the decoder step that writes tranquille takes a weighted sum of all seven encoder states, and nearly all the weight goes to quiet</title>
<desc id="desc">Seven encoder cells in a row with the English words of B1 beneath; a line from each cell to a summing node, drawn thicker for a larger weight and labelled with the weight; the sum feeds the decoder cell that writes tranquille.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="720" height="340" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<rect x="38" y="50" width="44" height="30" rx="2" fill="#cde2fb" stroke="#2a78d6" stroke-width="1"/>
<text x="60" y="42" text-anchor="middle">a</text>
<line x1="60" y1="80" x2="360" y2="202" stroke="#c3c2b7" stroke-width="0.7"/>
<text x="138" y="118.2" fill="#52514e" text-anchor="end">0.010</text>
<rect x="130" y="50" width="44" height="30" rx="2" fill="#cde2fb" stroke="#2a78d6" stroke-width="1"/>
<text x="152" y="42" text-anchor="middle">quiet</text>
<line x1="152" y1="80" x2="360" y2="202" stroke="#eb6834" stroke-width="8.9"/>
<text x="194.2" y="118.2" text-anchor="end">0.925</text>
<rect x="222" y="50" width="44" height="30" rx="2" fill="#cde2fb" stroke="#2a78d6" stroke-width="1"/>
<text x="244" y="42" text-anchor="middle">mystery</text>
<line x1="244" y1="80" x2="360" y2="202" stroke="#c3c2b7" stroke-width="0.9"/>
<text x="270.5" y="118.2" fill="#52514e" text-anchor="end">0.028</text>
<rect x="314" y="50" width="44" height="30" rx="2" fill="#cde2fb" stroke="#2a78d6" stroke-width="1"/>
<text x="336" y="42" text-anchor="middle">in</text>
<line x1="336" y1="80" x2="360" y2="202" stroke="#c3c2b7" stroke-width="0.8"/>
<text x="348.7" y="118.2" fill="#52514e">0.017</text>
<rect x="406" y="50" width="44" height="30" rx="2" fill="#cde2fb" stroke="#2a78d6" stroke-width="1"/>
<text x="428" y="42" text-anchor="middle">a</text>
<line x1="428" y1="80" x2="360" y2="202" stroke="#c3c2b7" stroke-width="0.7"/>
<text x="415.0" y="118.2" fill="#52514e">0.010</text>
<rect x="498" y="50" width="44" height="30" rx="2" fill="#cde2fb" stroke="#2a78d6" stroke-width="1"/>
<text x="520" y="42" text-anchor="middle">small</text>
<line x1="520" y1="80" x2="360" y2="202" stroke="#c3c2b7" stroke-width="0.7"/>
<text x="481.2" y="118.2" fill="#52514e">0.006</text>
<rect x="590" y="50" width="44" height="30" rx="2" fill="#cde2fb" stroke="#2a78d6" stroke-width="1"/>
<text x="612" y="42" text-anchor="middle">town</text>
<line x1="612" y1="80" x2="360" y2="202" stroke="#c3c2b7" stroke-width="0.6"/>
<text x="547.4" y="118.2" fill="#52514e">0.004</text>
<circle cx="360" cy="214" r="12" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="360" y="219" font-size="13" text-anchor="middle">Σ</text>
<text x="380" y="218" fill="#52514e">weighted sum of the seven states</text>
<line x1="360" y1="227" x2="360" y2="250" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="338" y="252" width="44" height="30" rx="2" fill="#f0efec" stroke="#eb6834" stroke-width="1.5"/>
<text x="360" y="300" text-anchor="middle">tranquille</text>
<text x="320" y="271" fill="#52514e" text-anchor="end">decoder step 3</text>
<text x="360" y="328" fill="#898781" text-anchor="middle">line width follows the weight; the seven weights add up to 1</text>
</g>
</svg>
