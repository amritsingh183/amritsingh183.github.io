<title id="title">The determinant of M − λI, and the parallelogram behind each value</title>
<desc id="desc">Top: det(M − λI) = λ² − 5λ + 6 plotted for λ from 0 to 4; it is zero at λ = 2 and λ = 3, the eigenvalues, and lowest, −0.25, at λ = 2.5. Bottom: the parallelogram of the columns of M − λI at five values, λ = 1: 2, λ = 2: 0, λ = 2.5: −0.25, λ = 3: 0, λ = 4: 2.</desc>
