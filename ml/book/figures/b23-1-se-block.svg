<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="title desc">
<title id="title">Squeeze-and-excitation: average each channel, pass the averages through two small layers, and rescale each channel by its gate</title>
<desc id="desc">Left, three 2 by 2 channel maps; then a column of their three averages, a single hidden number, three gate bars between 0 and 1, and on the right the three maps multiplied by their gates.</desc>
