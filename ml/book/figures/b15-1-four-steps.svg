<title id="title">Quantile normalisation in four steps on three reviewers&apos; scores</title>
<desc id="desc">Four grids of five books by three reviewers: the raw scores, each reviewer&apos;s scores sorted, each sorted row replaced by its mean, and the means put back in each reviewer&apos;s original order, with the tied value of reviewer 2 outlined.</desc>
