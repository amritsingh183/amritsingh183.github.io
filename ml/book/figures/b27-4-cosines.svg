<text x="424.5" y="159.0">mystery and town</text>
<text x="411.5" y="134.1">quiet</text>
<text x="432.0" y="200.9">small</text>
<text x="419.6" y="252.2">recipes</text>
<text x="377.5" y="306.4">kitchen</text>
<text x="316" y="40" fill="#52514e" text-anchor="middle">six rows of the trained table, as directions</text>
<text x="316" y="352" fill="#898781" text-anchor="middle">arrows drawn at one length and the picture turned as a whole:</text>
<text x="316" y="366" fill="#898781" text-anchor="middle">neither changes an angle, so neither changes a cosine</text>
<text x="544" y="84">mystery, town: 0.999</text>
<text x="544" y="104">quiet, small: 0.819</text>
<text x="544" y="124">recipes, kitchen: 0.855</text>
<text x="544" y="144">mystery, kitchen: 0.196</text>
<text x="544" y="62" font-weight="600">cosines</text>
