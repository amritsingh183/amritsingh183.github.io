<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="title desc">
<title id="title">Cosine similarity reads the angle between two vectors: 1 for the same direction, 0 for a right angle, −1 for opposite; in the trained table mystery and town point almost the same way</title>
<desc id="desc">Left: three small pairs of arrows at 0, 90 and 180 degrees with cosines 1, 0 and −1. Right: the trained two-number vectors of six words drawn as arrows from a common origin, with the cosines of three pairs listed underneath.</desc>
<rect width="720" height="380" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<text x="110" y="30" font-size="13" text-anchor="middle" font-weight="600">what the cosine says</text>
<line x1="70" y1="90" x2="114" y2="90" stroke="#2a78d6" stroke-width="2.5"/>
<line x1="70" y1="96" x2="105.2" y2="96" stroke="#eb6834" stroke-width="2.5"/>
<circle cx="70" cy="90" r="3" fill="#52514e"/>
<text x="130" y="88">cos 0° = 1</text>
<text x="130" y="104" fill="#52514e">same direction</text>
<line x1="70" y1="186" x2="114" y2="186" stroke="#2a78d6" stroke-width="2.5"/>
<line x1="70" y1="186" x2="70" y2="150.8" stroke="#eb6834" stroke-width="2.5"/>
<circle cx="70" cy="186" r="3" fill="#52514e"/>
<text x="130" y="184">cos 90° = 0</text>
<text x="130" y="200" fill="#52514e">right angle</text>
<line x1="70" y1="282" x2="114" y2="282" stroke="#2a78d6" stroke-width="2.5"/>
<line x1="70" y1="282" x2="34.8" y2="282" stroke="#eb6834" stroke-width="2.5"/>
<circle cx="70" cy="282" r="3" fill="#52514e"/>
<text x="130" y="280">cos 180° = −1</text>
<text x="130" y="296" fill="#52514e">opposite</text>
