<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="title desc">
<title id="title">A computation graph, run forwards</title>
<desc id="desc">Boxes for a = 5, b = 3 and c = 2 feed u = b × c = 6, then v = a + u = 11, then J = 3 × v = 33. Arrows point left to right, the direction the values flow.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="720" height="280" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<rect x="16" y="40" width="116" height="40" rx="2" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="74" y="57" text-anchor="middle" font-weight="600">a</text>
<text x="74" y="73" fill="#2a78d6" text-anchor="middle">value 5</text>
<rect x="16" y="120" width="116" height="40" rx="2" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="74" y="137" text-anchor="middle" font-weight="600">b</text>
<text x="74" y="153" fill="#2a78d6" text-anchor="middle">value 3</text>
<rect x="16" y="200" width="116" height="40" rx="2" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="74" y="217" text-anchor="middle" font-weight="600">c</text>
<text x="74" y="233" fill="#2a78d6" text-anchor="middle">value 2</text>
<rect x="212" y="160" width="116" height="40" rx="2" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="270" y="177" text-anchor="middle" font-weight="600">u = b × c</text>
<text x="270" y="193" fill="#2a78d6" text-anchor="middle">value 6</text>
<rect x="400" y="100" width="116" height="40" rx="2" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="458" y="117" text-anchor="middle" font-weight="600">v = a + u</text>
<text x="458" y="133" fill="#2a78d6" text-anchor="middle">value 11</text>
<rect x="588" y="100" width="116" height="40" rx="2" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="646" y="117" text-anchor="middle" font-weight="600">J = 3 × v</text>
<text x="646" y="133" fill="#2a78d6" text-anchor="middle">value 33</text>
<line x1="134" y1="140" x2="210" y2="172" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="134" y1="220" x2="210" y2="188" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="134" y1="60" x2="398" y2="112" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="330" y1="176" x2="398" y2="132" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="518" y1="120" x2="586" y2="120" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="360" y="258" fill="#52514e" text-anchor="middle">forward: each box computes its value from the boxes that feed it</text>
</g>
</svg>
