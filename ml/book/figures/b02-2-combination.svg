<text x="384" y="150" fill="#52514e">the same numbers, row by row:</text>
<text x="384" y="170">row 1: 2 × (−1) + (−1) × 2 = −4</text>
<text x="384" y="187">row 2: 1 × (−1) + 1 × 2 = 1</text>
<text x="384" y="226" fill="#52514e">the columns say where î and ĵ go;</text>
