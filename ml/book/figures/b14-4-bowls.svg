<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700" height="350" role="img" aria-labelledby="title desc">
<title id="title">Gradient descent in an elongated bowl zigzags; in a round bowl it goes straight to the bottom</title>
<desc id="desc">Left, contour ellipses, drawn to scale, of a stylised two-weight error bowl whose curvatures are the variances of the raw page counts and raw ages, very long and thin, with an orange descent path bouncing across the narrow valley; right, circular contours after standardising both columns and a single orange step to the centre.</desc>
