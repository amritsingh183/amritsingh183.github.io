<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="title desc">
<title id="title">The same graph, run backwards</title>
<desc id="desc">Each box now also holds its gradient, how much J moves per unit nudge of that box: J 1, v 3, u 3, a 3, b 6, c 9. Arrows point right to left and carry the local slopes that are multiplied along the way.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="720" height="300" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<rect x="16" y="40" width="116" height="56" rx="2" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="74" y="57" text-anchor="middle" font-weight="600">a</text>
<text x="74" y="73" fill="#2a78d6" text-anchor="middle">value 5</text>
<text x="74" y="89" fill="#eb6834" text-anchor="middle">grad 3</text>
<rect x="16" y="120" width="116" height="56" rx="2" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="74" y="137" text-anchor="middle" font-weight="600">b</text>
<text x="74" y="153" fill="#2a78d6" text-anchor="middle">value 3</text>
<text x="74" y="169" fill="#eb6834" text-anchor="middle">grad 6</text>
<rect x="16" y="200" width="116" height="56" rx="2" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="74" y="217" text-anchor="middle" font-weight="600">c</text>
<text x="74" y="233" fill="#2a78d6" text-anchor="middle">value 2</text>
<text x="74" y="249" fill="#eb6834" text-anchor="middle">grad 9</text>
<rect x="212" y="160" width="116" height="56" rx="2" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="270" y="177" text-anchor="middle" font-weight="600">u = b × c</text>
<text x="270" y="193" fill="#2a78d6" text-anchor="middle">value 6</text>
<text x="270" y="209" fill="#eb6834" text-anchor="middle">grad 3</text>
<rect x="400" y="100" width="116" height="56" rx="2" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="458" y="117" text-anchor="middle" font-weight="600">v = a + u</text>
<text x="458" y="133" fill="#2a78d6" text-anchor="middle">value 11</text>
<text x="458" y="149" fill="#eb6834" text-anchor="middle">grad 3</text>
<rect x="588" y="100" width="116" height="56" rx="2" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
<text x="646" y="117" text-anchor="middle" font-weight="600">J = 3 × v</text>
<text x="646" y="133" fill="#2a78d6" text-anchor="middle">value 33</text>
<text x="646" y="149" fill="#eb6834" text-anchor="middle">grad 1</text>
<line x1="586" y1="128" x2="518" y2="128" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="552" y="123" fill="#52514e" text-anchor="middle">× 3</text>
<line x1="398" y1="140" x2="330" y2="180" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="372" y="176" fill="#52514e">× 1</text>
<line x1="398" y1="112" x2="134" y2="64" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270" y="80" fill="#52514e" text-anchor="middle">× 1</text>
<line x1="210" y1="176" x2="134" y2="148" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="168" y="150" fill="#52514e" text-anchor="middle">× c = 2</text>
<line x1="210" y1="200" x2="134" y2="228" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="172" y="238" fill="#52514e" text-anchor="middle">× b = 3</text>
<text x="360" y="282" text-anchor="middle">grad of b = 3 × 1 × 2 = 6: the chain rule multiplies the slopes on the path back from J</text>
</g>
</svg>
