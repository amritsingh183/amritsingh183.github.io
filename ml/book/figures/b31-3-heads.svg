<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" role="img" aria-labelledby="title desc">
<title id="title">Two heads look at the same three words in two different ways at the same time, and their outputs are placed side by side</title>
<desc id="desc">The three word vectors on the left feed two heads drawn one above the other. Head 1 uses keys as they are, so each word attends mostly to itself; head 2 swaps the keys, so quiet and town attend to each other. Each head&apos;s two-number outputs are joined into four numbers per word.</desc>
