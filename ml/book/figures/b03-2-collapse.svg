<title id="title">A determinant of zero flattens the plane</title>
<desc id="desc">Left: the unit square and two different points, (2, 0) and (0, 1). Right: after a matrix with determinant 0 the whole plane lies on one line, the square is a segment, and both points land on (4, 2), so the move cannot be undone.</desc>
