<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="title desc">
<title id="title">An embedding model turns texts of any length into vectors of one fixed length, and similarity between texts becomes similarity between vectors</title>
<desc id="desc">Three texts of different lengths, two blurbs and a review, pass through an embedding model box and come out as three equal-length rows of cells; two of the rows feed a cosine similarity box.</desc>
