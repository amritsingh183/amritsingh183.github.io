<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="title desc">
<title id="title">Convolution is equivariant to a shift; pooling is only approximately invariant</title>
<desc id="desc">Two columns, before and after shifting a bright bar one cell to the right: the input strips, the detector outputs, which shift by the same one cell, and the max over each half, where the peak value 27 stays in the same pooled cell.</desc>
