<text x="16" y="26" font-size="13" font-weight="600">CBOW</text>
<rect x="16" y="40" width="90" height="22" rx="2" fill="#cde2fb" stroke="#c3c2b7" stroke-width="1"/>
<text x="61" y="55" text-anchor="middle">small</text>
<line x1="108" y1="51" x2="150" y2="92" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="16" y="68" width="90" height="22" rx="2" fill="#cde2fb" stroke="#c3c2b7" stroke-width="1"/>
