<text x="371" y="104" fill="#52514e" text-anchor="middle">one vector</text>
<line x1="422" y1="92" x2="438" y2="92" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="440" y="70" width="158" height="44" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="519" y="89" text-anchor="middle">score all 18 words</text>
