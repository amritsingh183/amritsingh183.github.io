<rect x="16" y="124" width="90" height="22" rx="2" fill="#cde2fb" stroke="#c3c2b7" stroke-width="1"/>
<text x="61" y="139" text-anchor="middle">a</text>
<line x1="108" y1="135" x2="150" y2="92" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="152" y="70" width="150" height="44" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="227" y="89" text-anchor="middle">look up 4 rows</text>
<text x="227" y="104" fill="#52514e" text-anchor="middle">18 rows × 2 numbers</text>
