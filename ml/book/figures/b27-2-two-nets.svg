<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="720" height="344" role="img" aria-labelledby="title desc">
<title id="title">CBOW guesses the centre word from its neighbours; skip-gram guesses each neighbour from the centre word; both look words up in the same table</title>
<desc id="desc">Two left-to-right flows. Top: four neighbour words enter a lookup box, their rows are averaged, every vocabulary word is scored and a softmax gives probabilities, and the target is detective. Bottom: detective enters the lookup box, its row scores every vocabulary word, and the targets are the four neighbours in turn.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="720" height="344" fill="#fcfcfb"/>
