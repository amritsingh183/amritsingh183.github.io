<line x1="600" y1="260" x2="620" y2="303" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="622" y="292" width="84" height="22" rx="2" fill="#cde2fb" stroke="#c3c2b7" stroke-width="1"/>
<text x="664" y="307" text-anchor="middle">a</text>
<text x="380" y="332" fill="#52514e" text-anchor="middle">one target at a time: four training examples from one window</text>
