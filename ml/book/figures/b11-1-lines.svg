<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="title desc">
<title id="title">Least squares against ridge on two points</title>
<desc id="desc">Two books, (1, 2) and (3, 5) (pages and price in hundreds). The least-squares line y = 0.5 + 1.5x passes through both. The ridge line for λ = 1, y = 1.5 + x, misses each by 0.5 but has the smaller total of squared misses plus λ times slope squared.</desc>
<rect width="720" height="320" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<line x1="50" y1="260" x2="350" y2="260" stroke="#e1e0d9" stroke-width="1"/>
<text x="45" y="264" fill="#898781" text-anchor="end">0</text>
<line x1="50" y1="227.1" x2="350" y2="227.1" stroke="#e1e0d9" stroke-width="1"/>
<text x="45" y="231.1" fill="#898781" text-anchor="end">1</text>
<line x1="50" y1="194.3" x2="350" y2="194.3" stroke="#e1e0d9" stroke-width="1"/>
<text x="45" y="198.3" fill="#898781" text-anchor="end">2</text>
<line x1="50" y1="161.4" x2="350" y2="161.4" stroke="#e1e0d9" stroke-width="1"/>
<text x="45" y="165.4" fill="#898781" text-anchor="end">3</text>
<line x1="50" y1="128.6" x2="350" y2="128.6" stroke="#e1e0d9" stroke-width="1"/>
<text x="45" y="132.6" fill="#898781" text-anchor="end">4</text>
<line x1="50" y1="95.7" x2="350" y2="95.7" stroke="#e1e0d9" stroke-width="1"/>
<text x="45" y="99.7" fill="#898781" text-anchor="end">5</text>
<line x1="50" y1="62.9" x2="350" y2="62.9" stroke="#e1e0d9" stroke-width="1"/>
<text x="45" y="66.9" fill="#898781" text-anchor="end">6</text>
<line x1="50" y1="30" x2="350" y2="30" stroke="#e1e0d9" stroke-width="1"/>
<text x="45" y="34" fill="#898781" text-anchor="end">7</text>
<line x1="116.7" y1="30" x2="116.7" y2="260" stroke="#e1e0d9" stroke-width="1"/>
<text x="116.7" y="274" fill="#898781" text-anchor="middle">1</text>
<line x1="183.3" y1="30" x2="183.3" y2="260" stroke="#e1e0d9" stroke-width="1"/>
<text x="183.3" y="274" fill="#898781" text-anchor="middle">2</text>
<line x1="250" y1="30" x2="250" y2="260" stroke="#e1e0d9" stroke-width="1"/>
<text x="250" y="274" fill="#898781" text-anchor="middle">3</text>
<line x1="316.7" y1="30" x2="316.7" y2="260" stroke="#e1e0d9" stroke-width="1"/>
<text x="316.7" y="274" fill="#898781" text-anchor="middle">4</text>
<line x1="50" y1="260" x2="350" y2="260" stroke="#c3c2b7" stroke-width="1"/>
<line x1="50" y1="30" x2="50" y2="260" stroke="#c3c2b7" stroke-width="1"/>
<path d="M50 243.6 L200 132.7 L338.9 30" fill="none" stroke="#eb6834" stroke-width="2.2"/>
<path d="M50 210.7 L200 136.8 L350 62.9" fill="none" stroke="#1baf7a" stroke-width="2.2"/>
<line x1="116.7" y1="194.3" x2="116.7" y2="189.3" stroke="#1baf7a" stroke-width="1.4"/>
<line x1="116.7" y1="185.8" x2="116.7" y2="180.8" stroke="#1baf7a" stroke-width="1.4"/>
<circle cx="116.7" cy="194.3" r="5" fill="#2a78d6"/>
<line x1="250" y1="95.7" x2="250" y2="100.7" stroke="#1baf7a" stroke-width="1.4"/>
<line x1="250" y1="104.2" x2="250" y2="109.2" stroke="#1baf7a" stroke-width="1.4"/>
<circle cx="250" cy="95.7" r="5" fill="#2a78d6"/>
<text x="338.9" y="24" fill="#eb6834" text-anchor="middle">least squares</text>
<text x="354" y="66.9" fill="#1baf7a">ridge</text>
<text x="200" y="292" fill="#52514e" text-anchor="middle">pages (hundreds)</text>
<text x="20" y="18" fill="#52514e">price (hundreds of rupees)</text>
<text x="390" y="50" font-size="13" font-weight="600">both lines scored with λ = 1</text>
<text x="390" y="80" fill="#eb6834" font-weight="600">least squares: y = 0.5 + 1.5x</text>
<text x="390" y="98">squared misses: 0</text>
<text x="390" y="115">penalty: 1 × 1.5² = 2.25</text>
<text x="390" y="132">total: 2.25</text>
<text x="390" y="170" fill="#1baf7a" font-weight="600">ridge: y = 1.5 + x</text>
<text x="390" y="188">squared misses: (−0.5)² + 0.5² = 0.5</text>
<text x="390" y="205">penalty: 1 × 1² = 1</text>
<text x="390" y="222">total: 1.5, the smallest possible</text>
<text x="390" y="262" fill="#52514e">the penalty is charged on the slope only,</text>
<text x="390" y="277" fill="#52514e">never on the intercept</text>
</g>
</svg>
