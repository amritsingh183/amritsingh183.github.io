<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" width="720" height="396" role="img" aria-labelledby="title desc">
<title id="title">The classic design: convolution and pooling turn a photo into small maps; fully connected layers and a softmax turn those into probabilities</title>
<desc id="desc">Top row, left to right: a 64 by 64 colour photo with 3 channels, 8 maps after the first convolution, 8 after pooling, 16 after the second convolution and 16 after pooling. Bottom row: those maps laid out as one list of 4,096 numbers, a fully connected layer of 64 units, 3 scores and a softmax giving 3 probabilities. The convolutions have 1,392 parameters, the fully connected layers 262,208 and 195; 263,795 in all.</desc>
