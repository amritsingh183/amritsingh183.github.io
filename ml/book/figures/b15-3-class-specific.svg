<title id="title">Class-specific quantile normalisation keeps the real difference between critics and fans</title>
<desc id="desc">Left, the grid after normalising the critics together and the fans together, with the fans-minus-critics column back at 3, 3, 3, 3 and 0; right, a table comparing the gaps in the raw scores, after normalising all columns, and after class-specific normalisation.</desc>
