<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" width="720" height="306" role="img" aria-labelledby="title desc">
<title id="title">A static embedding looks up book on its own and returns one vector for every sentence; a contextual model reads each sentence and returns a different vector for each use</title>
<desc id="desc">Top: the single word book goes into a lookup table and one row of cells comes out, the same for any sentence. Bottom: two sentences, one using book as a noun and one as a verb, go into a model that reads the whole sentence, and two differently shaded rows come out.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="720" height="306" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<text x="16" y="30" font-size="13" font-weight="600">static (Word2Vec, GloVe)</text>
<rect x="180" y="52" width="42.9" height="26" rx="2" fill="#86b6ef" stroke="#c3c2b7" stroke-width="1"/>
<text x="201.4" y="69" text-anchor="middle">book</text>
<line x1="236" y1="65" x2="290" y2="65" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="292" y="43" width="150" height="44" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="367" y="62" text-anchor="middle">lookup table</text>
<text x="367" y="77" fill="#52514e" text-anchor="middle">sees only the word</text>
<line x1="444" y1="65" x2="472" y2="65" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="476" y="55" width="22" height="20" rx="2" fill="#cde2fb" stroke="#e1e0d9" stroke-width="1"/>
<rect x="498" y="55" width="22" height="20" rx="2" fill="#86b6ef" stroke="#e1e0d9" stroke-width="1"/>
<rect x="520" y="55" width="22" height="20" rx="2" fill="#b7d3f6" stroke="#e1e0d9" stroke-width="1"/>
<rect x="542" y="55" width="22" height="20" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<rect x="564" y="55" width="22" height="20" rx="2" fill="#86b6ef" stroke="#e1e0d9" stroke-width="1"/>
<rect x="586" y="55" width="22" height="20" rx="2" fill="#cde2fb" stroke="#e1e0d9" stroke-width="1"/>
<text x="614" y="69" fill="#52514e">every sentence</text>
<line x1="16" y1="112" x2="704" y2="112" stroke="#e1e0d9" stroke-width="1"/>
<text x="16" y="138" font-size="13" font-weight="600">contextual (BERT)</text>
<rect x="16" y="156" width="36.2" height="26" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="34.1" y="173" text-anchor="middle">the</text>
<rect x="57.2" y="156" width="76.5" height="26" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="95.4" y="173" text-anchor="middle">detective</text>
<rect x="138.6" y="156" width="49.6" height="26" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="163.4" y="173" text-anchor="middle">reads</text>
