<title id="title">Four activation functions</title>
<desc id="desc">Four small plots over inputs from −4 to 4: ReLU is 0 for negatives and the input otherwise; sigmoid squeezes into 0 to 1; tanh squeezes into −1 to 1; the linear function returns its input. At z = 2 they give 2, 0.88, 0.96 and 2.</desc>
