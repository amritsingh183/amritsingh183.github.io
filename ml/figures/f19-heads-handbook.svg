<text x="360" y="244" font-size="11" fill="#52514e" text-anchor="middle">Kᵀ [2,2,4,3] → scores [2,2,3,3] → softmax → A@V [2,2,3,4] → transpose(1, 2) [2,3,2,4] → merge [2,3,8]</text>
<text x="360" y="258" font-size="11" fill="#52514e" text-anchor="middle">reshape separates a feature index into (head, feature in head);</text>
