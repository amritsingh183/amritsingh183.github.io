<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="title desc">
<title id="title">A 1×1 convolution reads one pixel at a time but all of its channels, and applies the same matrix at every pixel</title>
<desc id="desc">Input channel planes with one pixel marked, that pixel&apos;s channel vector, the shared weight matrix, the output vector and the output planes with the same pixel marked; height and width are unchanged.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="720" height="260" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<rect x="48" y="52" width="110" height="90" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<rect x="39" y="61" width="110" height="90" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<rect x="30" y="70" width="110" height="90" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<rect x="70" y="104" width="12" height="12" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1.5"/>
<text x="85" y="178" font-size="11" fill="#52514e" text-anchor="middle">3 channels R, G, B</text>
<rect x="578" y="52" width="110" height="90" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<rect x="569" y="61" width="110" height="90" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<rect x="560" y="70" width="110" height="90" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<rect x="600" y="104" width="12" height="12" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1.5"/>
<text x="615" y="178" font-size="11" fill="#52514e" text-anchor="middle">2 output channels</text>
<line x1="82" y1="110" x2="209" y2="68" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="150" y="58" font-size="11" fill="#52514e" text-anchor="middle">one pixel,</text>
<text x="150" y="72" font-size="11" fill="#52514e" text-anchor="middle">all channels</text>
<rect x="215" y="60" width="34" height="34" rx="2" fill="#b7d3f6" stroke="#e1e0d9" stroke-width="1"/>
<text x="232" y="81" text-anchor="middle">8</text>
<rect x="215" y="94" width="34" height="34" rx="2" fill="#b7d3f6" stroke="#e1e0d9" stroke-width="1"/>
<text x="232" y="115" text-anchor="middle">2</text>
<rect x="215" y="128" width="34" height="34" rx="2" fill="#b7d3f6" stroke="#e1e0d9" stroke-width="1"/>
<text x="232" y="149" text-anchor="middle">1</text>
<text x="232" y="178" font-size="11" fill="#52514e" text-anchor="middle">[R, G, B]</text>
<rect x="300" y="60" width="40" height="34" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="320" y="81" text-anchor="middle">0.5</text>
<rect x="340" y="60" width="40" height="34" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="360" y="81" text-anchor="middle">0.25</text>
<rect x="380" y="60" width="40" height="34" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="400" y="81" text-anchor="middle">0.25</text>
<rect x="300" y="94" width="40" height="34" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="320" y="115" text-anchor="middle">1</text>
<rect x="340" y="94" width="40" height="34" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="360" y="115" text-anchor="middle">−1</text>
<rect x="380" y="94" width="40" height="34" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="400" y="115" text-anchor="middle">0</text>
<text x="360" y="50" text-anchor="middle">the same 2 × 3 matrix at every location</text>
<line x1="253" y1="111" x2="296" y2="111" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="460" y="60" width="46" height="34" rx="2" fill="#b7d3f6" stroke="#e1e0d9" stroke-width="1"/>
<text x="483" y="81" text-anchor="middle">4.75</text>
<rect x="460" y="94" width="46" height="34" rx="2" fill="#b7d3f6" stroke="#e1e0d9" stroke-width="1"/>
<text x="483" y="115" text-anchor="middle">6</text>
<text x="442" y="98" font-size="13" fill="#52514e" text-anchor="middle">=</text>
<line x1="510" y1="94" x2="556" y2="110" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="300" y="158" font-size="11" fill="#52514e">0.5·8 + 0.25·2 + 0.25·1 = 4.75</text>
<text x="300" y="174" font-size="11" fill="#52514e">1·8 + (−1)·2 + 0·1 = 6</text>
<text x="360" y="236" font-size="11" fill="#52514e" text-anchor="middle">another location [1, 6, 3] through the same matrix → [2.75, −5]; no neighbouring pixel is consulted</text>
</g>
</svg>
