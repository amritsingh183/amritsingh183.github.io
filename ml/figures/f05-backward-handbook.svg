<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="title desc">
<title id="title">Backpropagation through a two-unit ReLU network: every gradient uses the forward-pass values, and the update comes last</title>
<desc id="desc">A left-to-right chain x, first layer, ReLU, second layer, prediction, loss with forward values above and gradients below, then a row with the updated parameters and the recomputed prediction.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="720" height="380" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<rect x="20" y="70" width="70" height="44" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="55" y="88" text-anchor="middle">x</text>
<text x="55" y="104" font-size="11" fill="#52514e" text-anchor="middle">[1, 2]</text>
<rect x="110" y="70" width="120" height="44" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="170" y="88" text-anchor="middle">x W₁ᵀ + b₁ = z₁</text>
<text x="170" y="104" font-size="11" fill="#52514e" text-anchor="middle">[1, 2]</text>
<rect x="250" y="70" width="100" height="44" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="300" y="88" text-anchor="middle">ReLU → h</text>
<text x="300" y="104" font-size="11" fill="#52514e" text-anchor="middle">[1, 2]</text>
<rect x="370" y="70" width="120" height="44" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="430" y="88" text-anchor="middle">h·w₂ + b₂ = ŷ</text>
<text x="430" y="104" font-size="11" fill="#52514e" text-anchor="middle">−1</text>
<rect x="510" y="70" width="80" height="44" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="550" y="88" text-anchor="middle">target y</text>
<text x="550" y="104" font-size="11" fill="#52514e" text-anchor="middle">0</text>
<rect x="610" y="70" width="90" height="44" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="655" y="88" text-anchor="middle">L = ½(ŷ − y)²</text>
<text x="655" y="104" font-size="11" fill="#52514e" text-anchor="middle">0.5</text>
<text x="170" y="58" font-size="11" fill="#52514e" text-anchor="middle">W₁ = I, b₁ = [0, 0]</text>
<text x="430" y="58" font-size="11" fill="#52514e" text-anchor="middle">w₂ = [1, −1], b₂ = 0</text>
<line x1="90" y1="92" x2="106" y2="92" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="230" y1="92" x2="246" y2="92" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="350" y1="92" x2="366" y2="92" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="490" y1="92" x2="506" y2="92" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="590" y1="92" x2="606" y2="92" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="360" y="130" font-size="11" fill="#52514e" text-anchor="middle">forward →</text>
<line x1="700" y1="160" x2="40" y2="160" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="360" y="154" font-size="11" fill="#52514e" text-anchor="middle">← backward: each box multiplies the gradient it receives by its own local derivative</text>
<text x="655" y="182" font-size="11" fill="#52514e" text-anchor="middle">∂L/∂ŷ = ŷ − y = −1</text>
<text x="430" y="182" font-size="11" fill="#52514e" text-anchor="middle">∂L/∂w₂ = δ·hᵀ</text>
<text x="430" y="196" font-size="11" fill="#52514e" text-anchor="middle">= [−1, −2]</text>
<text x="430" y="210" font-size="11" fill="#52514e" text-anchor="middle">∂L/∂b₂ = −1</text>
<text x="430" y="224" font-size="11" fill="#52514e" text-anchor="middle">∂L/∂h = w₂ᵀ·δ = [−1, 1]</text>
<text x="300" y="182" font-size="11" fill="#52514e" text-anchor="middle">ReLU: both z₁ &gt; 0,</text>
<text x="300" y="196" font-size="11" fill="#52514e" text-anchor="middle">so δ passes unchanged:</text>
<text x="300" y="210" font-size="11" fill="#52514e" text-anchor="middle">[−1, 1]</text>
<text x="170" y="182" font-size="11" fill="#52514e" text-anchor="middle">∂L/∂W₁ = δ·xᵀ</text>
<text x="170" y="196" font-size="11" fill="#52514e" text-anchor="middle">= [[−1, −2], [1, 2]]</text>
<text x="170" y="210" font-size="11" fill="#52514e" text-anchor="middle">∂L/∂b₁ = [−1, 1]</text>
<text x="55" y="182" font-size="11" fill="#898781" text-anchor="middle">x: data</text>
<rect x="20" y="268" width="680" height="92" rx="2" fill="#cde2fb" stroke="#2a78d6" stroke-width="1"/>
<text x="360" y="288" text-anchor="middle">all gradients first, then one SGD step with η = 0.1:</text>
<text x="360" y="308" fill="#52514e" text-anchor="middle">W₁&apos; = [[1.1, 0.2], [−0.1, 0.8]]   b₁&apos; = [0.1, −0.1]</text>
<text x="360" y="326" fill="#52514e" text-anchor="middle">w₂&apos; = [1.1, −0.8]   b₂&apos; = 0.1</text>
<text x="360" y="346" fill="#52514e" text-anchor="middle">recomputed: h&apos; = [1.6, 1.4], ŷ&apos; = 0.74, L&apos; = 0.2738</text>
</g>
</svg>
