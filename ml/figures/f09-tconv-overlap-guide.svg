<title id="title">A transposed convolution stamps its kernel once per input, stride positions apart, and adds: uneven overlap is the checkerboard</title>
<desc id="desc">Three panels for kernel widths 3, 4 and 2 at stride 2 with three inputs: each panel shows one stamp bar per input and the output strip with the number of stamps each position receives.</desc>
