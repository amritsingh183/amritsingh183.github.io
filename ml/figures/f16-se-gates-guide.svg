<text x="630" y="36" text-anchor="middle">Y (B, 64, H, W)</text>
<text x="360" y="262" font-size="11" fill="#52514e" text-anchor="middle">580 parameters = 2·64·4 weights + 4 + 64 biases; one number per channel scales every pixel of that channel</text>
<text x="360" y="280" font-size="11" fill="#52514e" text-anchor="middle">attention over channels: no tokens, no pairwise scores, only a learned gate per channel</text>
