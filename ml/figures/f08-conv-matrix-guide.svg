<rect x="94" y="44" width="34" height="136" rx="2" fill="none" stroke="#eb6834" stroke-width="1.5"/>
<text x="111" y="34" text-anchor="middle">C (4 × 3)</text>
<text x="175" y="116" font-size="13" fill="#52514e" text-anchor="middle">·</text>
