<text x="269" y="167" text-anchor="middle">3</text>
<text x="269" y="34" text-anchor="middle">y = C·x</text>
<text x="316" y="99">row 2 gathers x₁ and x₂: y₂ = 1·1 + 10·2 = 21</text>
<text x="316" y="150" font-size="11" fill="#eb6834">column 2: x₂ feeds y₂ and y₃, the outputs whose window holds it</text>
<text x="316" y="168" font-size="11" fill="#52514e">kernel h = [10, 1]: the same two weights on every diagonal</text>
<text x="360" y="216" font-size="11" fill="#52514e" text-anchor="middle">Cᵀ (section 7.3) reads the same entries column by column: a column scatters one input to its outputs</text>
