<text x="450" y="52" font-size="11" fill="#898781" text-anchor="middle">out</text>
<text x="360" y="214" text-anchor="middle">weight (4, 2, k, k)</text>
<text x="590" y="30" font-size="13" text-anchor="middle" font-weight="600">groups = 4 (depthwise)</text>
<line x1="500" y1="76.2" x2="590" y2="76.2" stroke="#2a78d6" stroke-width="1"/>
