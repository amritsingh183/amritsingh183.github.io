<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="title desc">
<title id="title">Groups decide which input channels a filter can read; depthwise means one channel each, and only the 1×1 that follows mixes again</title>
<desc id="desc">Three wiring panels: every input to every filter; two groups with separate colours; one channel per filter followed by a pointwise stage. The weight shape is written under each panel.</desc>
<rect width="720" height="280" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
