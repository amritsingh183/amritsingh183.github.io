<circle cx="40" cy="141.2" r="4" fill="#2a78d6"/>
<circle cx="40" cy="173.8" r="4" fill="#2a78d6"/>
<text x="40" y="52" font-size="11" fill="#898781" text-anchor="middle">in</text>
<text x="130" y="52" font-size="11" fill="#898781" text-anchor="middle">filters</text>
