<text x="590" y="214" text-anchor="middle">weight (4, 1, k, k)</text>
<text x="130" y="232" font-size="11" fill="#52514e" text-anchor="middle">each filter reads all 4 channels</text>
<text x="360" y="232" font-size="11" fill="#52514e" text-anchor="middle">each filter reads its own pair</text>
<text x="590" y="232" font-size="11" fill="#52514e" text-anchor="middle">each filter reads one channel</text>
<text x="360" y="262" font-size="11" fill="#52514e" text-anchor="middle">after a depthwise layer the channels have not met: the pointwise 1×1, weight (M, 4, 1, 1), is where they mix</text>
