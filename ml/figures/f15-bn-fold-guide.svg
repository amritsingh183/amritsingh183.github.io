<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="title desc">
<title id="title">With fixed statistics BatchNorm is a per-channel scale and shift, so it folds into the convolution before it and both routes give the same output</title>
<desc id="desc">Two lanes: convolution then BatchNorm, and the fused convolution with scaled weights and a new bias; a brace joins the two equal outputs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="720" height="260" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<text x="20" y="30" font-size="13" font-weight="600">conv, then BN (inference statistics)</text>
<rect x="20" y="46" width="60" height="44" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="50" y="72" text-anchor="middle">x</text>
<rect x="120" y="46" width="170" height="44" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="205" y="65" text-anchor="middle">conv: W (3, 2, 3, 3), b (3,)</text>
<text x="205" y="80" font-size="11" fill="#52514e" text-anchor="middle">z = W∗x + b</text>
<rect x="330" y="46" width="240" height="44" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="450" y="65" text-anchor="middle">BN: μ, σ², γ, β, each (3,)</text>
<text x="450" y="80" font-size="11" fill="#52514e" text-anchor="middle">y = γ·(z − μ)/√(σ² + ε) + β</text>
<rect x="610" y="46" width="80" height="44" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="650" y="72" text-anchor="middle">y</text>
<line x1="80" y1="68" x2="116" y2="68" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="290" y1="68" x2="326" y2="68" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="570" y1="68" x2="606" y2="68" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="108" text-anchor="middle">α = γ/√(σ² + ε), one number per output channel</text>
<text x="340" y="124" text-anchor="middle">W&apos; = α·W with α reshaped to (3, 1, 1, 1);   b&apos; = α·(b − μ) + β</text>
<text x="20" y="142" font-size="13" font-weight="600">fused: one convolution</text>
<rect x="20" y="150" width="60" height="44" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="50" y="176" text-anchor="middle">x</text>
<rect x="120" y="150" width="450" height="44" rx="2" fill="#cde2fb" stroke="#2a78d6" stroke-width="1"/>
<text x="345" y="169" text-anchor="middle">conv: W&apos; = α·W (3, 2, 3, 3), b&apos; (3,)</text>
<text x="345" y="184" font-size="11" fill="#52514e" text-anchor="middle">one pass over the activations instead of two</text>
<rect x="610" y="150" width="80" height="44" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="650" y="176" text-anchor="middle">y</text>
<line x1="80" y1="172" x2="116" y2="172" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="570" y1="172" x2="606" y2="172" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M696 46 h6 V194 h-6" fill="none" stroke="#52514e" stroke-width="1"/>
<text x="706" y="124" font-size="11" fill="#52514e"></text>
<text x="650" y="124" font-size="11" fill="#52514e" text-anchor="middle">same output</text>
<rect x="20" y="212" width="60" height="30" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="50" y="231" font-size="11" text-anchor="middle">W[0] × α₀</text>
<rect x="116" y="212" width="60" height="30" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="146" y="231" font-size="11" text-anchor="middle">W[1] × α₁</text>
<rect x="212" y="212" width="60" height="30" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="242" y="231" font-size="11" text-anchor="middle">W[2] × α₂</text>
<text x="316" y="224" font-size="11" fill="#52514e">α_c scales every weight of output channel c;</text>
<text x="316" y="238" font-size="11" fill="#52514e">a bare (3,) α would scale the kernel columns instead (12.2)</text>
<text x="360" y="254" font-size="11" fill="#52514e" text-anchor="middle">a convolution created without a bias gets one from the fold: b&apos; = β − α·μ</text>
</g>
</svg>
