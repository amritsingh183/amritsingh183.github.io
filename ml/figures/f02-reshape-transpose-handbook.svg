<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" width="720" height="296" role="img" aria-labelledby="title desc">
<title id="title">Reshape regroups the row-major sequence; transpose changes strides over the same storage</title>
<desc id="desc">A storage strip of numbers in memory order, a reshaped view that reads them in order with its strides, a transposed view that reads the same storage with swapped strides, and the new storage that contiguous() copies.</desc>
<rect width="720" height="296" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<text x="360" y="22" fill="#52514e" text-anchor="middle">storage of A [2,3], row-major: the six numbers never move</text>
<rect x="270" y="32" width="30" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="285" y="51" text-anchor="middle">1</text>
<rect x="300" y="32" width="30" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="315" y="51" text-anchor="middle">2</text>
<rect x="330" y="32" width="30" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="345" y="51" text-anchor="middle">3</text>
<rect x="360" y="32" width="30" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="375" y="51" text-anchor="middle">4</text>
<rect x="390" y="32" width="30" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="405" y="51" text-anchor="middle">5</text>
<rect x="420" y="32" width="30" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="435" y="51" text-anchor="middle">6</text>
<rect x="40" y="84" width="30" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="55" y="103" text-anchor="middle">1</text>
<rect x="70" y="84" width="30" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="85" y="103" text-anchor="middle">2</text>
<rect x="40" y="114" width="30" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="55" y="133" text-anchor="middle">3</text>
<rect x="70" y="114" width="30" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="85" y="133" text-anchor="middle">4</text>
<rect x="40" y="144" width="30" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="55" y="163" text-anchor="middle">5</text>
<rect x="70" y="144" width="30" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="85" y="163" text-anchor="middle">6</text>
<text x="112" y="103" font-size="11" fill="#52514e">strides (2, 1)</text>
<text x="40" y="190">reshape to [3,2]</text>
<text x="40" y="204" font-size="11" fill="#52514e">view[r][c] = storage[2·r + 1·c]: still in order</text>
<rect x="440" y="84" width="30" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="455" y="103" text-anchor="middle">1</text>
<rect x="470" y="84" width="30" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="485" y="103" text-anchor="middle">4</text>
<rect x="440" y="114" width="30" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="455" y="133" text-anchor="middle">2</text>
<rect x="470" y="114" width="30" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="485" y="133" text-anchor="middle">5</text>
<rect x="440" y="144" width="30" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="455" y="163" text-anchor="middle">3</text>
<rect x="470" y="144" width="30" height="30" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="485" y="163" text-anchor="middle">6</text>
<rect x="440" y="84" width="60" height="30" rx="2" fill="none" stroke="#2a78d6" stroke-width="1.5"/>
<text x="512" y="103" font-size="11" fill="#52514e">strides (1, 3)</text>
<text x="440" y="190">transpose to [3,2]</text>
<text x="440" y="204" font-size="11" fill="#52514e">view[r][c] = storage[1·r + 3·c]</text>
<text x="440" y="218" font-size="11" fill="#52514e">not contiguous until copied</text>
<line x1="285" y1="63" x2="55" y2="83" stroke="#2a78d6" stroke-width="1"/>
<line x1="315" y1="63" x2="85" y2="83" stroke="#2a78d6" stroke-width="1"/>
<line x1="285" y1="63" x2="455" y2="83" stroke="#2a78d6" stroke-width="1"/>
<line x1="375" y1="63" x2="485" y2="83" stroke="#2a78d6" stroke-width="1"/>
<text x="40" y="238">after contiguous(): a new storage, copied in the transposed order</text>
<rect x="40" y="248" width="30" height="30" rx="2" fill="#cde2fb" stroke="#e1e0d9" stroke-width="1"/>
<text x="55" y="267" text-anchor="middle">1</text>
<rect x="70" y="248" width="30" height="30" rx="2" fill="#cde2fb" stroke="#e1e0d9" stroke-width="1"/>
<text x="85" y="267" text-anchor="middle">4</text>
<rect x="100" y="248" width="30" height="30" rx="2" fill="#cde2fb" stroke="#e1e0d9" stroke-width="1"/>
<text x="115" y="267" text-anchor="middle">2</text>
<rect x="130" y="248" width="30" height="30" rx="2" fill="#cde2fb" stroke="#e1e0d9" stroke-width="1"/>
<text x="145" y="267" text-anchor="middle">5</text>
<rect x="160" y="248" width="30" height="30" rx="2" fill="#cde2fb" stroke="#e1e0d9" stroke-width="1"/>
<text x="175" y="267" text-anchor="middle">3</text>
<rect x="190" y="248" width="30" height="30" rx="2" fill="#cde2fb" stroke="#e1e0d9" stroke-width="1"/>
<text x="205" y="267" text-anchor="middle">6</text>
<text x="232" y="267" font-size="11" fill="#52514e">the only step that moves numbers</text>
</g>
</svg>
