<text x="240" y="103" font-size="11" fill="#52514e" text-anchor="middle">window 4</text>
<rect x="30" y="116" width="28" height="26" rx="2" fill="none" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="44" y="133" font-size="11" fill="#898781" text-anchor="middle">pad</text>
<rect x="58" y="116" width="28" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="72" y="133" font-size="11" text-anchor="middle">1</text>
<rect x="86" y="116" width="28" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
