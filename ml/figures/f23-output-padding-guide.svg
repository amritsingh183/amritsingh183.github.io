<text x="120" y="389" font-size="11" text-anchor="middle">2</text>
<rect x="138" y="372" width="36" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="156" y="389" font-size="11" text-anchor="middle">3</text>
