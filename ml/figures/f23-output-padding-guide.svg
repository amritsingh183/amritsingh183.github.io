<rect x="100" y="172" width="28" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="114" y="189" font-size="11" text-anchor="middle">1</text>
<rect x="128" y="172" width="28" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="142" y="189" font-size="11" text-anchor="middle">2</text>
<rect x="156" y="172" width="28" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
