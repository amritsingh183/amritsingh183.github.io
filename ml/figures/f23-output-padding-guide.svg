<text x="228" y="389" font-size="11" text-anchor="middle">5</text>
<rect x="246" y="372" width="36" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="264" y="389" font-size="11" text-anchor="middle">6</text>
<rect x="282" y="372" width="36" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="300" y="389" font-size="11" text-anchor="middle">7</text>
<rect x="318" y="372" width="36" height="26" rx="2" fill="#b7d3f6" stroke="#eb6834" stroke-width="1.5"/>
<text x="336" y="389" font-size="11" text-anchor="middle">8</text>
<text x="48" y="366" font-size="11" fill="#898781" text-anchor="middle">cropped</text>
<path d="M68 402 v5 H316 v-5" fill="none" stroke="#52514e" stroke-width="1"/>
<text x="192" y="419" font-size="11" fill="#52514e" text-anchor="middle">output_padding = 0 → H_out = 7</text>
<path d="M68 426 v5 H352 v-5" fill="none" stroke="#52514e" stroke-width="1"/>
<text x="210" y="443" font-size="11" fill="#52514e" text-anchor="middle">output_padding = 1 → H_out = 8</text>
<text x="400" y="290" font-size="11" fill="#52514e">H_out = (4 − 1)·2 − 2·1 + 1·(3 − 1)</text>
<text x="400" y="305" font-size="11" fill="#52514e">+ output_padding + 1 = 7 + output_padding</text>
<text x="400" y="320" font-size="11" fill="#52514e">column 8 is the tail of stamp 4:</text>
<text x="400" y="335" font-size="11" fill="#52514e">cropped when output_padding = 0,</text>
<text x="400" y="350" font-size="11" fill="#52514e">kept when output_padding = 1: one side only</text>
<text x="400" y="365" font-size="11" fill="#52514e">(in 2-D: the bottom row and the right column)</text>
