<rect x="464" y="172" width="28" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="478" y="189" font-size="11" text-anchor="middle">1</text>
<rect x="492" y="172" width="28" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="506" y="189" font-size="11" text-anchor="middle">2</text>
<rect x="520" y="172" width="28" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="534" y="189" font-size="11" text-anchor="middle">3</text>
<rect x="548" y="172" width="28" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="562" y="189" font-size="11" text-anchor="middle">4</text>
<text x="584" y="189">H_out = 4</text>
<text x="380" y="214" font-size="11" fill="#52514e">window 4 ends on pixel 8</text>
<rect x="30" y="225" width="10" height="10" rx="2" fill="#b7d3f6" stroke="#eb6834" stroke-width="1.5"/>
<text x="46" y="234" font-size="11" fill="#52514e">orange: the window that ends differently</text>
<text x="30" y="264" font-size="13" font-weight="600">back from 4: transposed convolution, stride 2, padding 1</text>
<text x="30" y="282">the 4 outputs, now the inputs</text>
<rect x="30" y="290" width="108" height="16" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1.5"/>
<text x="84" y="302" font-size="11" fill="#52514e" text-anchor="middle">stamp of 1</text>
<rect x="102" y="309" width="108" height="16" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1.5"/>
