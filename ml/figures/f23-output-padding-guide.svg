<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 462" width="720" height="462" role="img" aria-labelledby="title desc">
<title id="title">A stride-2 convolution gives the same output size for two input sizes; output_padding tells the transposed convolution which one to return</title>
<desc id="desc">Two forward panels (inputs 7 and 8, kernel 3, stride 2, padding 1) with their four windows and the shared output of 4, then the way back: four stamps into a strip of nine columns, where the padding crops the first and output_padding keeps the last. One axis of the photo is drawn; the other behaves the same, so in two dimensions the added positions are the bottom row and the right column.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="720" height="462" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<text x="30" y="24">H_in = 7, padding 1 each side</text>
