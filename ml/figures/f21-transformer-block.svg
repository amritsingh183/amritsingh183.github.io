<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="title desc">
<title id="title">Post-LN and pre-LN blocks contain the same four parts; only where the layer normalisation sits differs</title>
<desc id="desc">Two vertical flows: post-LN normalises after each skip addition; pre-LN normalises the input of each sub-layer. Skip connections are drawn as curves into the addition nodes; the LN boxes are shaded.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="720" height="360" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<text x="200" y="28" font-size="13" text-anchor="middle" font-weight="600">post-LN (the original paper)</text>
<text x="200" y="61" text-anchor="middle">x</text>
<line x1="200" y1="71" x2="200" y2="78" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="130" y="80" width="140" height="26" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="97" text-anchor="middle">Attention</text>
<line x1="200" y1="107" x2="200" y2="114" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="200" cy="129" r="11" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="200" y="133" font-size="13" text-anchor="middle">+</text>
<line x1="200" y1="143" x2="200" y2="150" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="130" y="152" width="140" height="26" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="169" text-anchor="middle">LayerNorm</text>
<line x1="200" y1="179" x2="200" y2="186" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="130" y="188" width="140" height="26" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="200" y="205" text-anchor="middle">FFN</text>
<line x1="200" y1="215" x2="200" y2="222" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="200" cy="237" r="11" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="200" y="241" font-size="13" text-anchor="middle">+</text>
<line x1="200" y1="251" x2="200" y2="258" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="130" y="260" width="140" height="26" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="200" y="277" text-anchor="middle">LayerNorm</text>
<line x1="200" y1="287" x2="200" y2="294" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="200" y="313" text-anchor="middle">y</text>
<path d="M206 70 C276 70 276 129 211 129" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="262.5" y="103.5" font-size="11" fill="#52514e">skip</text>
<path d="M206 178 C276 178 276 237 211 237" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="262.5" y="211.5" font-size="11" fill="#52514e">skip</text>
<text x="520" y="28" font-size="13" text-anchor="middle" font-weight="600">pre-LN (GPT-2 and most later models)</text>
<text x="520" y="61" text-anchor="middle">x</text>
<line x1="520" y1="71" x2="520" y2="78" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="450" y="80" width="140" height="26" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="520" y="97" text-anchor="middle">LayerNorm</text>
<line x1="520" y1="107" x2="520" y2="114" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="450" y="116" width="140" height="26" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="520" y="133" text-anchor="middle">Attention</text>
<line x1="520" y1="143" x2="520" y2="150" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="520" cy="165" r="11" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="520" y="169" font-size="13" text-anchor="middle">+</text>
<line x1="520" y1="179" x2="520" y2="186" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="450" y="188" width="140" height="26" rx="2" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="520" y="205" text-anchor="middle">LayerNorm</text>
<line x1="520" y1="215" x2="520" y2="222" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="450" y="224" width="140" height="26" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="520" y="241" text-anchor="middle">FFN</text>
<line x1="520" y1="251" x2="520" y2="258" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="520" cy="273" r="11" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="520" y="277" font-size="13" text-anchor="middle">+</text>
<line x1="520" y1="287" x2="520" y2="294" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="520" y="313" text-anchor="middle">y</text>
<path d="M526 70 C596 70 596 165 531 165" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="582.5" y="121.5" font-size="11" fill="#52514e">skip</text>
<path d="M526 178 C596 178 596 273 531 273" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="582.5" y="229.5" font-size="11" fill="#52514e">skip</text>
<line x1="360" y1="40" x2="360" y2="330" stroke="#e1e0d9" stroke-width="1"/>
<text x="360" y="340" font-size="11" fill="#52514e" text-anchor="middle">same four parts: attention, a per-token feed-forward network, two skip additions, two layer normalisations;</text>
<text x="360" y="354" font-size="11" fill="#52514e" text-anchor="middle">only the position of LayerNorm (shaded) differs</text>
</g>
</svg>
