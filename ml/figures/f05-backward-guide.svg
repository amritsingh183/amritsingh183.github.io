<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="title desc">
<title id="title">backward walks the chain in reverse: δ at the output, δ·xᵀ for the weight, then one SGD step</title>
<desc id="desc">A left-to-right chain x, linear layer, output, loss with forward values above and gradients below, and a final row with the SGD update.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="720" height="320" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<rect x="30" y="70" width="100" height="44" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="80" y="88" text-anchor="middle">x</text>
<text x="80" y="104" font-size="11" fill="#52514e" text-anchor="middle">[1, 2]</text>
<rect x="180" y="70" width="170" height="44" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="265" y="88" text-anchor="middle">Linear, no bias</text>
<text x="265" y="104" font-size="11" fill="#52514e" text-anchor="middle">W = [1, 1]</text>
<rect x="400" y="70" width="110" height="44" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="455" y="88" text-anchor="middle">ŷ = W·x</text>
<text x="455" y="104" font-size="11" fill="#52514e" text-anchor="middle">3</text>
<rect x="560" y="70" width="130" height="44" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="625" y="88" text-anchor="middle">L = (ŷ − 1)²</text>
<text x="625" y="104" font-size="11" fill="#52514e" text-anchor="middle">4</text>
<line x1="130" y1="92" x2="176" y2="92" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="153" y="87" font-size="11" fill="#52514e" text-anchor="middle">forward</text>
<line x1="350" y1="92" x2="396" y2="92" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="510" y1="92" x2="556" y2="92" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="556" y1="150" x2="510" y2="150" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="533" y="145" font-size="11" fill="#52514e" text-anchor="middle">backward</text>
<line x1="396" y1="150" x2="350" y2="150" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="176" y1="150" x2="130" y2="150" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="625" y="176" font-size="11" fill="#52514e" text-anchor="middle">δ = ∂L/∂ŷ = 2·(3 − 1) = 4</text>
<text x="455" y="176" font-size="11" fill="#52514e" text-anchor="middle">δ arrives at ŷ</text>
<text x="265" y="176" font-size="11" fill="#52514e" text-anchor="middle">∂L/∂W = δ·xᵀ = 4·[1, 2] = [4, 8]</text>
<text x="265" y="192" font-size="11" fill="#898781" text-anchor="middle">∂L/∂x = Wᵀ·δ = [4, 4] (passed on if x had a producer)</text>
<text x="92" y="176" font-size="11" fill="#898781" text-anchor="middle">x is data: no gradient kept</text>
<rect x="30" y="240" width="660" height="52" rx="2" fill="#cde2fb" stroke="#2a78d6" stroke-width="1"/>
<text x="360" y="260" text-anchor="middle">GradStore: { W ↦ [4, 8] } — computed with the forward-pass values; nothing updated yet</text>
<text x="360" y="280" fill="#52514e" text-anchor="middle">then one SGD step (η = 0.1): W ← [1, 1] − 0.1·[4, 8] = [0.6, 0.2], and forward([1, 2]) = 1</text>
</g>
</svg>
