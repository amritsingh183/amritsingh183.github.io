<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="title desc">
<title id="title">Partial self-attention splits the channels after a 1×1 convolution, runs attention and a feed-forward network on one half, and fuses the halves with another 1×1</title>
<desc id="desc">A left-to-right flow with two channel bands, the lower one passing through attention and a feed-forward stage with skips, then concatenation and a 1×1 convolution; an inset states the score-matrix size.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="720" height="300" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<rect x="16" y="110" width="110" height="40" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="71" y="134" text-anchor="middle">x (B, C, H, W)</text>
<rect x="150" y="110" width="70" height="40" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="185" y="134" text-anchor="middle">1×1 conv</text>
<line x1="126" y1="130" x2="146" y2="130" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="220" y1="130" x2="248" y2="130" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="234" y="125" font-size="11" fill="#52514e" text-anchor="middle">split</text>
<rect x="250" y="60" width="300" height="32" rx="2" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="400" y="80" text-anchor="middle">a: (B, C/2, H, W), untouched</text>
<rect x="250" y="140" width="300" height="100" rx="2" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
<text x="262" y="156" font-size="11" fill="#52514e">b: (B, C/2, H, W) — BatchNorm, not LayerNorm</text>
<rect x="262" y="170" width="110" height="30" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="317" y="189" text-anchor="middle">MHSA</text>
<circle cx="392" cy="185" r="9" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="392" y="189" text-anchor="middle">+</text>
<rect x="414" y="170" width="80" height="30" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="454" y="189" text-anchor="middle">FFN</text>
<circle cx="516" cy="185" r="9" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="516" y="189" text-anchor="middle">+</text>
<line x1="372" y1="185" x2="381" y2="185" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="401" y1="185" x2="410" y2="185" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="494" y1="185" x2="505" y2="185" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M262 170 C262 210 392 220 392 194" fill="none" stroke="#52514e" stroke-width="1"/>
<path d="M414 170 C414 210 516 220 516 194" fill="none" stroke="#52514e" stroke-width="1"/>
<text x="327" y="230" font-size="11" fill="#52514e" text-anchor="middle">skip</text>
<text x="465" y="230" font-size="11" fill="#52514e" text-anchor="middle">skip</text>
<line x1="248" y1="130" x2="248" y2="76" stroke="#52514e" stroke-width="1.5"/>
<line x1="248" y1="76" x2="250" y2="76" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="248" y1="130" x2="248" y2="190" stroke="#52514e" stroke-width="1.5"/>
<line x1="248" y1="190" x2="250" y2="190" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="550" y1="76" x2="578" y2="120" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="550" y1="190" x2="578" y2="140" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="580" y="110" width="60" height="40" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="610" y="134" text-anchor="middle">concat</text>
<rect x="650" y="110" width="60" height="40" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="680" y="134" text-anchor="middle">1×1 conv</text>
<line x1="640" y1="130" x2="646" y2="130" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="712" y="166" font-size="11" fill="#52514e" text-anchor="end">out (B, C, H, W)</text>
<text x="360" y="258" text-anchor="middle">scores per head: N × N with N = H·W</text>
<text x="360" y="274" font-size="11" fill="#52514e" text-anchor="middle">cost grows with N²: hence only after the last,</text>
<text x="360" y="288" font-size="11" fill="#52514e" text-anchor="middle">lowest-resolution stage, and only on half the channels</text>
</g>
</svg>
