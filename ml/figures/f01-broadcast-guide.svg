<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-labelledby="title desc">
<title id="title">Broadcasting aligns shapes from the right</title>
<desc id="desc">Two panels of shape rulers. Left: a size-1 axis stretches to match the other operand. Right: a one-dimensional per-channel vector aligned from the right lands on the last axis unless it is reshaped to put its length on the channel axis.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="720" height="250" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b">
<text x="20" y="24" font-size="13" font-weight="600">asked for: broadcast</text>
<text x="151" y="46" font-size="11" fill="#898781" text-anchor="middle">batch</text>
<text x="203" y="46" font-size="11" fill="#898781" text-anchor="middle">channels</text>
<text x="255" y="46" font-size="11" fill="#898781" text-anchor="middle">height</text>
<text x="307" y="46" font-size="11" fill="#898781" text-anchor="middle">width</text>
<text x="118" y="71" fill="#52514e" text-anchor="end">image</text>
