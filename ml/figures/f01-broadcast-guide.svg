<rect x="644" y="54" width="46" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="667" y="71" text-anchor="middle">3</text>
<text x="634" y="113" fill="#52514e" text-anchor="end">α (3,)</text>
<rect x="644" y="96" width="46" height="26" rx="2" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
<text x="667" y="113" text-anchor="middle">3</text>
<text x="690" y="136" font-size="11" fill="#eb6834" text-anchor="end">lands on kw: the kernel columns</text>
<text x="690" y="149" font-size="11" fill="#52514e" text-anchor="end">(aligned from the right)</text>
<text x="478" y="177" fill="#52514e" text-anchor="end">α reshaped</text>
<rect x="488" y="160" width="46" height="26" rx="2" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="511" y="177" text-anchor="middle">3</text>
<rect x="540" y="160" width="46" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="563" y="177" text-anchor="middle">1</text>
<rect x="592" y="160" width="46" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="615" y="177" text-anchor="middle">1</text>
<rect x="644" y="160" width="46" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="667" y="177" text-anchor="middle">1</text>
<text x="589" y="206" font-size="11" fill="#52514e" text-anchor="middle">reshape first: one α per output channel</text>
<text x="360" y="236" font-size="11" fill="#898781" text-anchor="middle">size 1 stretches; a (3,) vector aligns with the last axis</text>
</g>
</svg>
