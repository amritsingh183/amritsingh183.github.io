<rect x="128" y="152" width="46" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="151" y="169" text-anchor="middle">1</text>
<rect x="180" y="152" width="46" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
