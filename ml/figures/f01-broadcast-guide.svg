<text x="255" y="71" text-anchor="middle">2</text>
<rect x="284" y="54" width="46" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="307" y="71" text-anchor="middle">2</text>
<text x="118" y="113" fill="#52514e" text-anchor="end">gate</text>
<rect x="128" y="96" width="46" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="151" y="113" text-anchor="middle">1</text>
<rect x="180" y="96" width="46" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
