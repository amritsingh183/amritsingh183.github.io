<text x="255" y="113" text-anchor="middle">1</text>
<rect x="284" y="96" width="46" height="26" rx="2" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<rect x="284" y="96" width="46" height="26" rx="2" fill="none" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="307" y="113" text-anchor="middle">1</text>
<line x1="255" y1="124" x2="255" y2="148" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="307" y1="124" x2="307" y2="148" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="258" y="140" font-size="11" fill="#52514e" text-anchor="middle">stretched</text>
