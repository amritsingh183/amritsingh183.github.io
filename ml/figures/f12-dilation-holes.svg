<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="title desc">
<title id="title">Dilation spaces a kernel&apos;s weights apart; stacked equal dilations reach only multiples of d and leave holes, while 1, 2, 5 cover every offset</title>
<desc id="desc">A 3-weight kernel with dilation 2 drawn on five positions, then two panels of offset number lines showing which input positions one output reads after each of three layers: dilations 4, 4, 4 leave holes; dilations 1, 2, 5 do not.</desc>
