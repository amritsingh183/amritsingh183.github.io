<text x="360" y="226" font-size="11" text-anchor="middle">row 2: [a, 0, −∞] → weights [0.669762, 0.330238, 0] → output 0.669762·[2, 0] + 0.330238·[0, 1] = [1.339523, 0.330238]</text>
<text x="360" y="241" font-size="11" fill="#52514e" text-anchor="middle">U8 1 = blocked in this handbook&apos;s Candle fragment; PyTorch&apos;s boolean SDPA mask uses True = allowed</text>
<text x="360" y="254" font-size="11" fill="#eb6834" text-anchor="middle">a row of only −∞ gives NaN: never mask every key of a query</text>
